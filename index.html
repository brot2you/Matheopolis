<!DOCTYPE html>
<html lang="fr">
<head>
<script src="https://brot2you.github.io/b2y-outils/b2y-sauvegarde.js" data-app="Mathéopolis" data-keys="matheopolis_v2"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2a1646">
<title>Mathéopolis — by BROT2YOU</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Trebuchet MS",system-ui,-apple-system,sans-serif;color:#38284a;background:#24143c url('assets/map.webp') center top/cover fixed;min-height:100vh}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(#25143ecc,#1d0f33f2);z-index:-1}
button,input,select{font:inherit}
img{max-width:100%}
a{color:#6b2fa0}
:focus-visible{outline:3px solid #ffb84a;outline-offset:2px}

/* En-tête */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#24143e,#52266d,#24143e);border-bottom:4px solid #efc568;box-shadow:0 5px 24px #150e2d88}
.head{max-width:1220px;margin:auto;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{width:min(230px,52vw);height:62px;background:url('assets/logo.webp') center/contain no-repeat;border:0;padding:0;cursor:pointer;box-shadow:none}
.purse{display:flex;align-items:center;gap:6px;background:#1a0d2ecc;border:2px solid #efc568;border-radius:30px;padding:3px 12px 3px 4px;color:#ffe39b;font-weight:800}
.nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.nav button{font-size:14px;color:#fff;background:linear-gradient(#8842b2,#512078);border:2px solid #edbe57;box-shadow:0 3px 0 #301448;border-radius:15px;padding:8px 12px;font-weight:800;cursor:pointer}
.nav button.on{background:linear-gradient(#ffd97b,#d99d35);color:#37234c;box-shadow:0 3px 0 #8b5b29}

.shell{max-width:1220px;margin:auto;padding:14px 14px 90px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif}
.shell>h2{color:#ffdf91;text-shadow:0 3px 5px #1b102c;margin:26px 4px 10px}

/* Boutons */
.btn{cursor:pointer;border:2px solid #9b6229;border-radius:14px;padding:11px 16px;font-weight:800;background:linear-gradient(#ffd97b,#d99d35);color:#37234c;box-shadow:0 3px 0 #8b5b29;transition:transform .12s,filter .12s;text-decoration:none;display:inline-block;text-align:center}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8b5b29}
.btn.alt{background:linear-gradient(#f2e9ff,#cdb0ec);border-color:#8962b0;box-shadow:0 3px 0 #6b4592;color:#42265b}
.btn.ghost{background:#fff8e9;border-color:#d7b46b;box-shadow:0 3px 0 #c9a25c;color:#4d2d70}
.btn.danger{background:linear-gradient(#ffd4cf,#e9a199);border-color:#a5544b;box-shadow:0 3px 0 #8c4038}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;filter:grayscale(.6)}
.royal{cursor:pointer;border:0;background:url('assets/buttons.webp') 0 0/200% 200% no-repeat;width:300px;max-width:100%;aspect-ratio:3/1;color:#fff;font:800 19px Georgia,serif;text-shadow:0 2px 3px #2a0f40;padding:0 16%;box-shadow:none;filter:drop-shadow(0 5px 6px #1b0d2e66)}
.royal:hover{background-position:100% 0}
.royal[disabled]{background-position:100% 100%;cursor:not-allowed;color:#ddd}
.kitlink{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;background:#e9f6ff;border:2px solid #9cc7e3;border-radius:12px;padding:8px 11px;color:#1f4f73;text-decoration:none}
.kitlink:hover{background:#d6eeff}

/* Cartes et panneaux */
.panel,.card{background:linear-gradient(#fff5df,#f6dfb2);border:4px solid #b17b39;border-radius:20px;box-shadow:0 6px 0 #63417b,0 12px 30px #170d2870}
.panel{padding:20px;margin:16px 0;position:relative}
.panel h1{margin:0 0 8px;color:#4d2d70;font-size:clamp(23px,4vw,32px)}
.panel h2{color:#4d2d70;margin:18px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{padding:16px;overflow:hidden;display:flex;flex-direction:column}
.card h3{margin:6px 0 8px;color:#4d2d70}
.card p{line-height:1.5;margin:6px 0}
.card .grow{flex:1}
.cardimg{display:block;width:calc(100% + 32px);max-width:none;height:150px;object-fit:cover;margin:-16px -16px 12px;border-bottom:4px solid #c38d3d}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:30px;background:#f5e3b7;border:1px solid #d7b46b;padding:4px 11px;margin:3px 3px 3px 0;font-size:13px;font-weight:700}
.muted{color:#6a5677}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{justify-content:space-between}
.progress{background:#e1c7a4;height:12px;border-radius:20px;overflow:hidden}
.progress>div{height:100%;background:linear-gradient(90deg,#8e57d2,#e7b54f);border-radius:20px}
.guide{width:105px;max-height:150px;object-fit:contain;float:right;margin:0 0 6px 10px;filter:drop-shadow(0 4px 6px #2c164c66)}
.banner{position:relative;border:4px solid #d5a455;border-radius:22px;overflow:hidden;margin:14px 0;box-shadow:0 8px 28px #100a2277}
.banner img{width:100%;height:clamp(140px,24vw,260px);object-fit:cover;display:block}
.banner .ov{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,#24143ef2);padding:44px 18px 14px;color:#ffe5a5;font:700 clamp(20px,3.2vw,32px) Georgia,serif}
.banner .ov small{display:block;font:600 14px "Trebuchet MS",sans-serif;color:#f4e6ff}

/* Accueil */
.hero{border-radius:24px;min-height:300px;background:linear-gradient(90deg,#271642e6 0%,#271642bb 50%,#27164210 100%),url('assets/home.webp') center/cover;border:4px solid #f5ca67;box-shadow:0 10px 35px #100824a8;color:#fff;padding:clamp(18px,4vw,44px);display:flex;flex-direction:column;justify-content:center;margin:14px 0}
.hero h1{font-family:Georgia,serif;color:#ffe39b;text-shadow:0 3px 4px #24143e;margin:0 0 6px;font-size:clamp(27px,5vw,44px)}
.hero p{font-size:17px;line-height:1.55;max-width:600px;margin:6px 0}
.hero .pill{color:#34244d}
.mapwrap{position:relative;border:4px solid #d5a455;border-radius:22px;overflow:hidden;box-shadow:0 8px 28px #100a2277}
.mapwrap img{display:block;width:100%}
.hot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0;cursor:pointer;box-shadow:none}
.hot .he{width:clamp(38px,6.5vw,64px);height:clamp(38px,6.5vw,64px);border-radius:50%;background:radial-gradient(#fff6dc,#f2c96d);border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:clamp(19px,3.4vw,32px);box-shadow:0 0 0 4px #7b3fb0aa,0 6px 14px #1b0d2e99;animation:pulse 2.6s ease-in-out infinite}
.hot .hl{background:#24143ee8;color:#ffe39b;border:2px solid #efc568;border-radius:12px;padding:2px 8px;font-size:clamp(10px,1.6vw,13px);font-weight:800;white-space:nowrap}
.hot:hover .he{transform:scale(1.08)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px #7b3fb0aa,0 6px 14px #1b0d2e99}50%{box-shadow:0 0 0 9px #f2c96d55,0 6px 14px #1b0d2e99}}
.advice{display:flex;gap:14px;align-items:flex-start}
.advice img{width:92px;flex:none;filter:drop-shadow(0 4px 6px #2c164c66)}
.todo{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff8e9;border:2px solid #dfc18b;border-radius:14px;padding:10px 12px;margin:8px 0;flex-wrap:wrap}
.todo b{color:#4d2d70}

/* Territoire : bâtiments */
.plots{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.plot{background:#fff8e9;border:3px dashed #cfae73;border-radius:18px;padding:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.plot .pe{font-size:46px;line-height:1.1;filter:grayscale(1) opacity(.35)}
.plot.can .pe{filter:grayscale(.3) opacity(.8)}
.plot.built{border-style:solid;background:linear-gradient(#fffaf0,#f8e7c0)}
.plot.built .pe{filter:none;animation:bob 3s ease-in-out infinite}
.plot.lv1{border-color:#c4813f;box-shadow:0 0 0 3px #e9b77f55}
.plot.lv2{border-color:#9aa6b8;box-shadow:0 0 0 3px #cfd8e6}
.plot.lv3{border-color:#e0a91f;box-shadow:0 0 0 4px #ffd75e,0 0 18px #ffd75e}
.plot b{color:#4d2d70;font-family:Georgia,serif}
.plot .small{min-height:34px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.mission{display:flex;align-items:center;gap:12px;background:#fff8e9;border:2px solid #dfc18b;border-radius:15px;padding:10px 12px;margin:9px 0;flex-wrap:wrap}
.mission .mi{flex:1;min-width:170px}
.mission .mi b{display:block;color:#4d2d70}
.mission .acts{display:flex;gap:8px;flex-wrap:wrap}

/* Sprites */
.spr{display:inline-block;width:auto;vertical-align:middle;flex:none}
.ring{display:inline-block;border-radius:50%;border:3px dashed #cfae73;flex:none;vertical-align:middle}
.shield{display:inline-flex;align-items:center;justify-content:center;background:url('assets/shields.webp') no-repeat;background-size:500% 100%;color:#fff;font-weight:900;text-shadow:0 2px 3px #000a;flex:none;vertical-align:middle}

/* Exercice */
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;background:#e1c7a4;border:2px solid #b8925a;display:inline-block}
.dots i.ok{background:#55b37e;border-color:#2f7d52}
.dots i.ko{background:#f0a35a;border-color:#b5662a}
.dots i.now{background:#fff;border-color:#7b3fb0;box-shadow:0 0 0 3px #b98ee0}
.qbox{background:#fff;border:3px solid #dfc18b;border-radius:16px;padding:16px;margin:12px 0}
.qtext{font-size:clamp(18px,2.6vw,22px);font-weight:700;line-height:1.5}
.ctx{background:#f3ecff;border-left:5px solid #8e57d2;border-radius:10px;padding:10px 12px;margin-bottom:10px;line-height:1.5}
.fig{display:block;width:100%;max-width:340px;margin:10px auto}
.fig .s{fill:#fde9b8;stroke:#4d2d70;stroke-width:3;stroke-linejoin:round}
.fig .l{stroke:#4d2d70;stroke-width:3;fill:none}
.fig .d{stroke:#8e57d2;stroke-width:2.5;stroke-dasharray:6 5;fill:none}
.fig .k{stroke:#4d2d70;stroke-width:2;fill:none}
.fig .a{stroke:#c0392b;stroke-width:2.5;fill:none}
.fig text{font:bold 16px "Trebuchet MS",sans-serif;fill:#4d2d70}
.fig text.v{fill:#8e3fb8;font-size:17px}
.ansrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.answer{width:100%;max-width:260px;border:3px solid #c3a16b;border-radius:12px;padding:12px;background:#fff;font-size:20px;font-weight:700}
.answer:disabled{background:#f6f0e4;color:#555}
.keys button{min-width:44px;padding:10px 0;border-radius:10px;border:2px solid #b8925a;background:#fff3d6;font-weight:900;font-size:18px;cursor:pointer;color:#4d2d70}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-top:10px}
.choice{cursor:pointer;border:3px solid #c3a16b;background:#fff;border-radius:13px;padding:13px;font-size:18px;font-weight:700;color:#38284a;text-align:center;line-height:1.4}
.choice:hover{background:#fff7e3}
.choice.sel{border-color:#7b3fb0;background:#f1e6ff}
.choice.good{border-color:#2f7d52;background:#d6f3df}
.choice.bad{border-color:#b5662a;background:#ffe7cf}
.choice:disabled{cursor:default}
.feedback{border-radius:14px;padding:13px 14px;margin-top:12px;background:#e6f3fa;line-height:1.55}
.feedback.good{background:#d6f3df;border:2px solid #8fcfa6}
.feedback.bad{background:#fff0d6;border:2px solid #f0bf7a}
.feedback .trap{background:#fff;border-radius:10px;padding:8px 10px;margin:8px 0;border-left:5px solid #e08a2e}
.hintbox{background:#fffbe0;border:2px dashed #e0c25a;border-radius:12px;padding:10px 12px;margin-top:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.92em;line-height:1.15;margin:0 2px}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.fr>span{padding:0 3px}

.code{font-family:ui-monospace,Menlo,Consolas,monospace;background:#2b2140;color:#f6e7c8;border-left:6px solid #e7a93a;border-radius:10px;padding:10px 14px;margin:10px 0;font-size:15px;line-height:1.7}
.code b{color:#ffcf6b}
.tbl{overflow-x:auto;margin:10px 0}.tbl table{border-collapse:collapse;margin:auto}.tbl td{border:2px solid #b8925a;padding:8px 14px;text-align:center;font-weight:700;background:#fff;min-width:44px}
.vec{position:relative;display:inline-block;padding-top:.35em}.vec:before{content:'\2192';position:absolute;top:-.45em;left:0;right:0;text-align:center;font-size:.85em}
.thh{margin:18px 0 4px;color:#7a4a12;font-size:17px;border-bottom:2px dashed #d7b46b;padding-bottom:4px}

/* Quêtes */
.scroll{background:url('assets/parchment.webp') center/100% 100% no-repeat;padding:clamp(48px,9vw,90px) clamp(40px,9vw,95px);min-height:330px;color:#3b2a1c;font-size:17px;line-height:1.6;position:relative}
.scroll h1{color:#5a2d0c;margin-top:0;font-size:clamp(22px,3.6vw,30px)}
.questhead{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.questhead img{width:clamp(110px,18vw,170px);filter:drop-shadow(0 6px 8px #1b0d2e88)}
.stars{color:#e0a91f;font-size:20px;letter-spacing:2px}
.stars .off{color:#d8c7a6}

/* Donjon */
.clock{font:900 26px Georgia,serif;color:#67368c;background:#fff;border:3px solid #b98ee0;border-radius:14px;padding:4px 14px}
.clock.low{color:#c0392b;border-color:#e59a8f}
.reslist .todo{align-items:flex-start}

/* Trésor */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:#fff8e9;border:2px solid #dfc18b;border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;color:#4d2d70;font-family:Georgia,serif}
.blasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.blason{text-align:center;background:#fff8e9;border:2px solid #dfc18b;border-radius:16px;padding:10px}
.blason b{display:block;color:#4d2d70;margin-top:4px}
.answer.sm{font-size:16px;padding:10px;max-width:240px}

/* Toast, modale, confettis */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(150%);background:#24143ef2;color:#ffe39b;border:3px solid #efc568;border-radius:18px;padding:12px 18px;font-weight:800;z-index:60;transition:transform .3s;max-width:92vw;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px #000a}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast:not(.on){visibility:hidden;transition:transform .3s,visibility 0s .3s}
#modal{position:fixed;inset:0;background:#120826bb;display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
#modal.on{display:flex}
#modal .panel{max-width:460px;width:100%}
.burst{position:fixed;z-index:80;pointer-events:none;font-size:26px;animation:fly 1.4s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.6);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1.2) rotate(240deg);opacity:0}}
footer{text-align:center;color:#f8dfac;padding:10px 10px 40px;font-size:14px}
.hidden{display:none!important}
#sheet{position:fixed;inset:0;background:#120826cc;display:none;align-items:flex-start;justify-content:center;z-index:65;padding:16px;overflow-y:auto}
#sheet.on{display:flex}
.sheetbox{max-width:760px;width:100%;margin:10px auto 40px}
.kitlink{cursor:pointer;font:inherit;font-weight:800;font-size:14px}
.fhead{display:flex;gap:14px;align-items:center}
.fhead img{width:84px;flex:none;filter:drop-shadow(0 4px 6px #2c164c66)}
.fhead h1{margin:6px 0 0}
.fsec{background:#fff;border-radius:14px;padding:4px 16px 8px;margin:12px 0;border-left:6px solid #8e57d2;line-height:1.6}
.fsec h3{margin:10px 0 4px;color:#4d2d70}
.fsec ul,.fsec ol{padding-left:22px;margin:6px 0}.fsec li{margin:4px 0}
.fe{border-color:#3d7dd8}.fx{border-color:#2f9d62}.fp{border-color:#e08a2e;background:#fff7ec}.fr2{border-color:#e0b21f;background:#fffbe6}

@media(max-width:640px){
 .shell{padding:10px 10px 90px}
 .head{justify-content:center;padding:6px 8px}
 .brand{height:48px;width:170px}
 .nav{gap:3px;flex-wrap:nowrap}
 .nav button{font-size:10.5px;padding:6px 4px;border-radius:12px;white-space:nowrap}
 .hero{min-height:250px;background:linear-gradient(#281543d9,#281543b0),url('assets/home.webp') center/cover}
 .hero p{font-size:15px}
 .guide{width:72px}
 .panel{padding:14px}
 .advice img{width:64px}
 .royal{width:260px;font-size:17px}
 .scroll{background:linear-gradient(#fbecc8,#f3dba6);border:5px solid #b17b39;border-radius:18px;padding:20px}
 .hot .hl{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="head">
<button class="brand" data-act="go" data-p="home" aria-label="Mathéopolis — accueil"></button>

<button data-act="go" data-p="home">🏰 Royaume</button>

<script type="application/json" id="grimoire">{"fiches":{"6-dec":{"t":"Nombres décimaux : lire, comparer, ranger","e":["Chaque chiffre a une valeur selon sa place : unités, **dixièmes** ({1/10}), **centièmes** ({1/100}), **millièmes** ({1/1000}).","Pour comparer : d'abord les parties entières, puis les dixièmes, puis les centièmes…","Ajouter des zéros à droite de la partie décimale ne change pas le nombre : 3,7 = 3,70 = 3,700."],"ex":["Comparer 3,7 et 3,65.","3,7 = 3,70. Même partie entière : 3.","Dixièmes : 7 > 6, donc **3,7 > 3,65**."],"p":"Croire que 3,65 > 3,7 « parce que 65 > 7 ». La partie décimale ne se lit pas comme un nombre entier.","r":"Je complète avec des zéros pour avoir autant de chiffres après la virgule."},"6-frac":{"t":"Les fractions : des nombres à part entière","e":["{a/b} est le nombre qui, multiplié par b, donne a : c'est aussi le **quotient** a ÷ b.","Une fraction peut partager une unité ({3/4} : on coupe en 4, on prend 3 parts) ou agir sur une quantité ({3/4} de 20).","À connaître par cœur : {1/2} = 0,5 ; {1/4} = 0,25 ; {3/4} = 0,75 ; {1/10} = 0,1 ; {1/5} = 0,2.","Une fraction se place sur une demi-droite graduée : {7/4} est entre 1 et 2, car 4 quarts = 1 et 8 quarts = 2."],"ex":["Calculer {3/4} de 20.","20 ÷ 4 = 5 (un quart).","5 × 3 = 15, donc **{3/4} de 20 = 15**."],"p":"Écrire {1/3} = 0,3. En réalité {1/3} = 0,333… : 0,3 n'en est qu'une valeur approchée.","r":"Fraction d'une quantité : je divise par le dénominateur, puis je multiplie par le numérateur."},"6-frac2":{"t":"Fractions égales et sommes simples","e":["On obtient une fraction égale en multipliant (ou divisant) le numérateur **et** le dénominateur par le même nombre : {2/3} = {8/12}.","Même dénominateur : on additionne les numérateurs et on garde le dénominateur : {1/4} + {2/4} = {3/4}.","Sinon, on cherche d'abord des fractions égales qui ont le même dénominateur : {1/2} + {1/4} = {2/4} + {1/4} = {3/4}."],"ex":["Calculer {2/3} + {1/6}.","{2/3} = {4/6} (× 2 en haut et en bas).","{4/6} + {1/6} = **{5/6}**."],"p":"Additionner les dénominateurs : {1/2} + {1/3} n'est pas {2/5}. On ne coupe pas le gâteau en 5 en ajoutant deux parts !","r":"Avant d'additionner, je vérifie : les parts sont-elles de la même taille (même dénominateur) ?"},"6-ops":{"t":"Les quatre opérations et la division euclidienne","e":["Vocabulaire : **somme** (+), **différence** (−), **produit** (×), **quotient** (÷).","Division euclidienne de a par b : a = b × q + r, avec un reste r **plus petit que** b.","Multiplier par 10, 100, 1 000 : chaque chiffre prend une valeur 10, 100, 1 000 fois plus grande (la virgule « se décale » vers la droite)."],"ex":["Division euclidienne de 47 par 6.","6 × 7 = 42 et 6 × 8 = 48 (trop grand).","47 = 6 × 7 + 5 : **quotient 7, reste 5**."],"p":"Garder un reste plus grand que le diviseur : si r ≥ b, on pouvait mettre une fois de plus b dans a.","r":"Je vérifie toujours : diviseur × quotient + reste = dividende."},"6-div":{"t":"Multiples, diviseurs, critères de divisibilité","e":["a est un **multiple** de b (et b un **diviseur** de a) si la division de a par b tombe juste.","Par 2 : chiffre des unités pair. Par 5 : se termine par 0 ou 5. Par 10 : se termine par 0.","Par 3 : la somme des chiffres est dans la table de 3. Par 9 : la somme des chiffres est dans la table de 9."],"ex":["342 est-il divisible par 2, 3, 9 ?","Unités : 2 est pair → divisible par 2.","3 + 4 + 2 = 9 → divisible par 3 **et** par 9."],"p":"Utiliser le dernier chiffre pour 3 ou 9 : 13 finit par 3 mais n'est pas divisible par 3.","r":"Pour 3 et 9, j'additionne les chiffres. Pour 2, 5 et 10, je regarde le dernier."},"6-prio":{"t":"Priorités opératoires","e":["On calcule d'abord ce qui est **entre parenthèses**.","Puis les **multiplications et divisions**, avant les additions et soustractions.","À priorité égale, on calcule de gauche à droite."],"ex":["Calculer 5 + 3 × 4 puis (5 + 3) × 4.","5 + 3 × 4 = 5 + 12 = **17**.","(5 + 3) × 4 = 8 × 4 = **32**."],"p":"Calculer dans l'ordre de lecture : 5 + 3 × 4 n'est pas 32.","r":"Je souligne d'abord le calcul prioritaire, puis je recopie la ligne en le remplaçant par son résultat."},"6-prop":{"t":"Reconnaître et utiliser la proportionnalité","e":["Deux grandeurs sont proportionnelles si on passe de l'une à l'autre en multipliant toujours par le **même nombre** (le coefficient).","Trois procédures : **linéarité** (si on double l'une, on double l'autre ; on peut additionner des colonnes), **retour à l'unité**, **coefficient**.","Contextes typiques : prix, recettes, distances à vitesse constante, échelles."],"ex":["3 cahiers coûtent 4,50 €. Combien coûtent 7 cahiers ?","Retour à l'unité : 4,50 ÷ 3 = 1,50 € le cahier.","7 × 1,50 = **10,50 €**."],"p":"Voir de la proportionnalité partout : la taille d'un enfant n'est pas proportionnelle à son âge.","r":"Je teste : si je double la première grandeur, la seconde double-t-elle aussi ?"},"6-pct":{"t":"Pourcentages simples","e":["t % signifie « t pour 100 » : t % de x = {t/100} × x.","Repères : 50 % = la moitié ; 25 % = le quart ; 75 % = trois quarts ; 10 % = diviser par 10 ; 1 % = diviser par 100."],"ex":["Calculer 20 % de 45.","10 % de 45 = 4,5.","20 % = 2 × 10 % → **9**."],"p":"Confondre 10 % et 10 : 10 % de 230 ne vaut pas 10.","r":"Je pars de 10 % ou de 50 %, puis je combine."},"6-aires":{"t":"Périmètres et aires","e":["**Périmètre** = longueur du contour (en cm, m…). **Aire** = surface couverte (en cm², m²…).","Rectangle : P = 2 × (L + l) ; A = L × l. Carré : P = 4 × c ; A = c × c.","Triangle rectangle : A = (côté × côté de l'angle droit) ÷ 2.","Cercle : longueur = 2 × π × r. Disque : A = π × r × r (π ≈ 3,14)."],"ex":["Rectangle de 5 cm sur 3 cm.","P = 2 × (5 + 3) = **16 cm**.","A = 5 × 3 = **15 cm²**."],"p":"Mélanger les unités : un périmètre en cm², une aire en cm. Deux figures de même périmètre n'ont pas forcément la même aire.","r":"Je me demande : je fais le tour (périmètre) ou je recouvre (aire) ?"},"6-conv":{"t":"Unités de longueur, masse, contenance et durées","e":["Longueurs : km, hm, dam, **m**, dm, cm, mm — on passe d'une unité à la suivante en multipliant ou divisant par 10.","Masses : kg, hg, dag, **g**, dg, cg, mg. Contenances : hL, daL, **L**, dL, cL, mL.","Durées : 1 h = 60 min ; 1 min = 60 s ; 1 j = 24 h. Le système n'est **pas** décimal : 0,5 h = 30 min."],"ex":["Convertir 2,4 km en m, puis 135 min en h et min.","1 km = 1 000 m → 2,4 × 1 000 = **2 400 m**.","135 = 2 × 60 + 15 → **2 h 15 min**."],"p":"Écrire 1,5 h = 1 h 50 min. En réalité 1,5 h = 1 h 30 min (la moitié d'une heure).","r":"Pour une conversion, je trace un tableau d'unités et je place le chiffre des unités dans la bonne colonne."},"6-vol":{"t":"Volume du pavé droit","e":["Le volume mesure la place occupée. Unité : cm³, dm³, m³…","Pavé droit : V = L × l × h. Cube : V = c × c × c.","Lien avec les contenances : **1 dm³ = 1 L** et 1 cm³ = 1 mL."],"ex":["Une boîte de 4 cm × 3 cm × 2 cm.","V = 4 × 3 × 2 = **24 cm³**.","Elle peut contenir 24 mL."],"p":"Penser qu'un cube de côté 2 cm a un volume de 2 cm³ ou 6 cm³ : c'est 2 × 2 × 2 = 8 cm³.","r":"Je compte combien de petits cubes de 1 cm de côté remplissent la boîte."},"6-ang":{"t":"Les angles","e":["Un angle est formé de deux demi-droites de même origine (le sommet).","**Aigu** : moins de 90°. **Droit** : 90°. **Obtus** : entre 90° et 180°. **Plat** : 180°.","Au rapporteur : centre sur le sommet, 0 sur un côté, on lit la graduation qui part de ce 0."],"ex":["Mesurer un angle « ouvert » à 120°.","On place le 0 sur un côté.","On lit 120 sur la graduation partant de ce 0 (et non 60). C'est un angle **obtus**."],"p":"Lire la mauvaise graduation du rapporteur (60° au lieu de 120°).","r":"Avant de mesurer, j'estime : l'angle est-il plus petit ou plus grand qu'un angle droit ?"},"6-sym":{"t":"Symétrie axiale et médiatrice","e":["Le symétrique de A par rapport à la droite d est A' tel que d soit la **médiatrice** de [AA'].","La médiatrice d'un segment est la droite perpendiculaire à ce segment en son milieu.","Tout point de la médiatrice est à égale distance des deux extrémités du segment.","La symétrie conserve les longueurs, les angles, les aires et l'alignement."],"ex":["Construire le symétrique de A par rapport à d.","Je trace la perpendiculaire à d passant par A.","Je reporte la distance de A à d de l'autre côté : j'obtiens **A'**."],"p":"Reporter le point « en face » sans tracer de perpendiculaire : le symétrique est alors décalé.","r":"Je plie mentalement la feuille le long de l'axe : les deux figures se superposent-elles ?"},"6-fig":{"t":"Triangles et quadrilatères particuliers","e":["Triangle **isocèle** : 2 côtés égaux. **Équilatéral** : 3 côtés égaux. **Rectangle** : un angle droit.","**Rectangle** : 4 angles droits. **Losange** : 4 côtés égaux. **Carré** : 4 angles droits et 4 côtés égaux.","Un carré est à la fois un rectangle et un losange."],"ex":["ABCD a 4 côtés de 5 cm et un angle droit.","4 côtés égaux → c'est un losange.","Un losange avec un angle droit est un **carré**."],"p":"Dire « un carré n'est pas un rectangle ». Il en a toutes les propriétés.","r":"Je code la figure (traits égaux, angles droits) avant de la nommer."},"6-data":{"t":"Données et premières probabilités","e":["Avant de lire un tableau ou un graphique : je regarde le **titre**, les **axes**, les **unités** et la **graduation**.","Hasard : un évènement peut être **impossible**, **certain**, ou plus ou moins **probable**.","Quand les issues ont toutes la même chance (dé équilibré), on dit : « 1 chance sur 6 » d'obtenir le 4."],"ex":["On lance un dé équilibré à 6 faces.","« Obtenir 7 » est **impossible**.","« Obtenir un nombre pair » : 3 chances sur 6, soit 1 chance sur 2."],"p":"Lire un graphique sans regarder la graduation : un carreau ne vaut pas toujours 1.","r":"Je compte les issues favorables et toutes les issues possibles."},"6-info":{"t":"Pensée informatique : instructions et boucles","e":["Un programme est une **suite d'instructions** exécutées dans l'ordre.","Une **boucle** « répéter n fois » évite d'écrire plusieurs fois la même chose."],"ex":["Répéter 4 fois : avancer de 50, tourner de 90°.","Le lutin trace 4 côtés de 50 pas.","Il tourne 4 × 90° = 360° : il trace un **carré**."],"p":"Confondre l'angle dont on tourne et l'angle de la figure : pour un triangle équilatéral, on tourne de 120°, pas de 60°.","r":"Je joue le programme « à la main » avec un crayon avant de le lancer."},"5-rel":{"t":"Nombres relatifs : additionner et soustraire","e":["Un nombre relatif a un **signe** et une **distance à zéro**. −5 et +5 sont **opposés**.","Même signe : on additionne les distances à zéro et on garde le signe.","Signes contraires : on soustrait les distances à zéro ; on prend le signe du nombre le plus éloigné de zéro.","Soustraire un nombre, c'est **additionner son opposé** : 4 − (−3) = 4 + 3."],"ex":["Calculer (−5) + (+8) puis 4 − (−3).","Signes contraires : 8 − 5 = 3, signe de +8 → **+3**.","4 − (−3) = 4 + 3 = **7**."],"p":"Écrire −3 − 5 = −2. C'est −3 + (−5) = **−8** : on s'éloigne encore de zéro.","r":"Je pense à un thermomètre : il fait −3 °C et la température baisse de 5 °C."},"5-frac":{"t":"Fractions : comparer, additionner, soustraire","e":["Pour comparer ou additionner, on met les fractions au **même dénominateur**.","On choisit un dénominateur commun (souvent l'un est multiple de l'autre).","Une fraction est aussi un **quotient** : {7/3} est le nombre qui multiplié par 3 donne 7."],"ex":["Calculer {3/4} − {1/8}.","{3/4} = {6/8}.","{6/8} − {1/8} = **{5/8}**."],"p":"Additionner numérateurs et dénominateurs entre eux.","r":"Avant tout calcul, je regarde si un dénominateur est un multiple de l'autre."},"5-pui":{"t":"Carrés et cubes","e":["a² (« a au carré ») = a × a. a³ (« a au cube ») = a × a × a.","Carrés parfaits à connaître : 1, 4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144.","Le carré sert pour les aires, le cube pour les volumes."],"ex":["Calculer 4³.","4 × 4 = 16.","16 × 4 = **64**."],"p":"Écrire 5² = 10. On multiplie 5 par lui-même : 5² = 25.","r":"L'exposant dit combien de fois le nombre apparaît dans la multiplication."},"5-lit":{"t":"Calcul littéral : les premières expressions","e":["Une lettre désigne un nombre. On peut **remplacer** la lettre par une valeur pour calculer.","Conventions : 3 × a s'écrit 3a ; a × a s'écrit a² ; on n'écrit pas le × devant une lettre ou une parenthèse.","Une égalité peut être vraie pour certaines valeurs et fausse pour d'autres : on la **teste**."],"ex":["Calculer 2x + 5 pour x = 3.","2x = 2 × 3 = 6.","6 + 5 = **11**."],"p":"Remplacer « collé » : pour x = 4, 3x vaut 3 × 4 = 12, pas 34.","r":"Quand je remplace une lettre, je remets le signe × visible."},"5-dur":{"t":"Calculer avec des durées","e":["1 h = 60 min ; 1 min = 60 s. Pour additionner des durées, on additionne les heures, puis les minutes, et on convertit si on dépasse 60.","Durée = heure de fin − heure de début. On peut compter « par bonds » jusqu'à l'heure ronde."],"ex":["Un film commence à 20 h 45 et dure 1 h 50.","20 h 45 + 1 h = 21 h 45.","21 h 45 + 50 min = 21 h 95 min = **22 h 35**."],"p":"Faire une soustraction décimale : 10 h 15 − 9 h 40 n'est pas 0 h 75.","r":"Je compte par bonds : 9 h 40 → 10 h (20 min) → 10 h 15 (15 min) = 35 min."},"5-prop":{"t":"Proportionnalité : coefficient, vitesse, échelle","e":["Le **coefficient de proportionnalité** permet de passer d'une ligne à l'autre du tableau.","Vitesse moyenne : distance = vitesse × durée (à 90 km/h, on parcourt 90 km en 1 h).","Échelle : distance sur le plan et distance réelle sont proportionnelles. Échelle {1/25 000} : 1 cm sur la carte = 25 000 cm en vrai."],"ex":["Sur une carte au {1/25 000}, deux villages sont à 4 cm.","4 × 25 000 = 100 000 cm.","100 000 cm = **1 km**."],"p":"Oublier de convertir les unités (cm sur la carte, km dans la réalité).","r":"Je fais un tableau à deux lignes avec les unités écrites en début de ligne."},"5-graph":{"t":"Proportionnalité et graphique","e":["Dans un repère, on place des points (abscisse ; ordonnée) à partir d'un tableau de valeurs.","Une situation de proportionnalité est représentée par des **points alignés avec l'origine** du repère.","Si les points sont alignés mais que la droite ne passe pas par l'origine : **pas** proportionnel."],"ex":["Taxi : 3 € de prise en charge + 2 € par km.","1 km → 5 € ; 2 km → 7 € ; 3 km → 9 €.","Les points sont alignés mais la droite ne passe pas par (0 ; 0) : **pas proportionnel**."],"p":"Conclure « proportionnel » dès que les points sont alignés.","r":"Je vérifie deux choses : alignés ? passe par l'origine ?"},"5-fct":{"t":"« En fonction de » : tableaux et formules","e":["Une grandeur dépend d'une autre : le prix payé **en fonction du** nombre d'articles.","On traduit cette dépendance par un **tableau de valeurs**, une **formule** ou un **graphique**.","Exemple de formule : P = 2,5 × n (prix P en fonction du nombre n de baguettes à 2,50 €)."],"ex":["Le périmètre P d'un carré en fonction de son côté c.","Formule : P = 4 × c.","c = 1 → P = 4 ; c = 2,5 → P = **10**."],"p":"Inverser les rôles : ici c'est le périmètre qui dépend du côté, pas l'inverse.","r":"Je me demande : quelle grandeur je choisis, et laquelle se calcule ?"},"5-pct":{"t":"Pourcentages et proportions","e":["Appliquer un pourcentage : t % de x = x × t ÷ 100.","Une **proportion** compare une partie au tout : 12 filles sur 30 élèves → {12/30} = 0,4 = **40 %**.","Une proportion s'écrit en fraction, en décimal ou en pourcentage."],"ex":["Dans une classe de 25 élèves, 9 sont demi-pensionnaires.","Proportion : {9/25}.","{9/25} = {36/100} = **36 %**."],"p":"Diviser dans le mauvais sens : la proportion est partie ÷ tout, pas tout ÷ partie.","r":"Je cherche un dénominateur 100 (ou j'utilise la division)."},"5-ang":{"t":"Angles et parallélisme","e":["Deux droites coupées par une sécante forment des angles **alternes-internes** et **correspondants**.","Si les deux droites sont **parallèles**, ces angles sont égaux. Réciproquement, s'ils sont égaux, les droites sont parallèles.","Deux angles **opposés par le sommet** sont égaux."],"ex":["(d) ∥ (d') et un angle correspondant mesure 65°.","Droites parallèles → angles correspondants égaux.","L'autre angle mesure **65°**."],"p":"Utiliser l'égalité des angles alors que les droites ne sont pas parallèles.","r":"Je repère la forme : « Z » pour alternes-internes, « F » pour correspondants."},"5-tri":{"t":"Triangles : angles, inégalité, droites remarquables","e":["La somme des angles d'un triangle vaut **180°**.","**Inégalité triangulaire** : chaque côté est plus petit que la somme des deux autres. Sinon, le triangle n'existe pas.","Les médiatrices se coupent au centre du **cercle circonscrit**. On étudie aussi hauteurs, médianes et bissectrices.","Aire du triangle : A = (base × hauteur) ÷ 2."],"ex":["Un triangle a deux angles de 50° et 70°.","50 + 70 = 120.","180 − 120 = **60°**."],"p":"Prendre pour hauteur un côté quelconque : la hauteur est **perpendiculaire** à la base.","r":"Pour savoir si un triangle existe, je compare le plus grand côté à la somme des deux autres."},"5-para":{"t":"Parallélogrammes et demi-tour","e":["**Parallélogramme** : quadrilatère dont les côtés opposés sont parallèles.","Propriétés : côtés opposés de même longueur ; angles opposés égaux ; diagonales qui se coupent en leur **milieu** (c'est son centre de symétrie : le demi-tour).","Propriété caractéristique : un quadrilatère dont les diagonales se coupent en leur milieu est un parallélogramme.","Rectangle : diagonales de même longueur. Losange : diagonales perpendiculaires. Carré : les deux.","Aire du parallélogramme : A = base × hauteur."],"ex":["ABCD a des diagonales qui se coupent en leur milieu et sont perpendiculaires.","Milieu commun → parallélogramme.","Diagonales perpendiculaires → **losange**."],"p":"Prendre le côté oblique comme hauteur dans le calcul d'aire.","r":"Je pars des diagonales : milieu commun ? même longueur ? perpendiculaires ?"},"5-sol":{"t":"Solides : prisme droit et cylindre","e":["Prisme droit et cylindre : V = **aire de la base × hauteur**.","Aire du disque : A = π × r². Donc cylindre : V = π × r² × h.","Patron d'un cylindre : deux disques et un rectangle dont la longueur est le périmètre du disque."],"ex":["Cylindre de rayon 2 cm et de hauteur 5 cm.","Base : π × 2² = 4π cm².","V = 4π × 5 = 20π ≈ **62,8 cm³**."],"p":"Utiliser le diamètre à la place du rayon.","r":"Je calcule d'abord l'aire de la base, puis je multiplie par la hauteur."},"5-stat":{"t":"Effectifs, fréquences, moyenne","e":["**Effectif** : nombre de fois où une valeur apparaît. **Fréquence** = effectif ÷ effectif total (en fraction, décimal ou %).","**Moyenne** = somme des valeurs ÷ nombre de valeurs.","On représente les données avec des tableaux, des diagrammes en barres ou circulaires."],"ex":["Notes : 12, 15 et 9.","Somme : 12 + 15 + 9 = 36.","Moyenne : 36 ÷ 3 = **12**."],"p":"Diviser par une mauvaise quantité (oublier une valeur ou compter des zéros en trop).","r":"Je vérifie : la moyenne est entre la plus petite et la plus grande valeur."},"5-proba":{"t":"Le langage des probabilités","e":["**Expérience aléatoire** : on ne peut pas prévoir le résultat. Chaque résultat possible est une **issue**. Un **évènement** regroupe des issues.","Si toutes les issues ont la même chance (équiprobabilité) : P = nombre d'issues favorables ÷ nombre d'issues possibles.","Une probabilité est toujours entre 0 (impossible) et 1 (certain)."],"ex":["Un sac contient 3 boules rouges et 5 bleues. On tire une boule.","Issues possibles : 8.","P(rouge) = **{3/8}**."],"p":"Trouver une probabilité supérieure à 1, ou compter les issues défavorables au lieu des favorables.","r":"Je compte toutes les issues avant de compter celles qui m'intéressent."},"5-info":{"t":"Pensée informatique : séquences, entrées, sorties","e":["Un programme reçoit une **entrée** (demander un nombre), effectue des calculs, produit une **sortie** (dire un résultat).","La boucle « répéter n fois » est **inconditionnelle** : elle tourne exactement n fois."],"ex":["Demander un nombre ; mettre résultat à réponse × 2 + 3 ; dire résultat.","Entrée : 5.","5 × 2 + 3 = 13 : le lutin dit **13**."],"p":"Oublier l'ordre : les instructions s'exécutent de haut en bas.","r":"Je fais un tableau de suivi : une colonne par étape."},"4-rel":{"t":"Relatifs : multiplier et diviser","e":["**Règle des signes** : deux nombres de même signe → résultat positif ; de signes contraires → résultat négatif.","Pour un produit de plusieurs facteurs : nombre **pair** de facteurs négatifs → positif ; **impair** → négatif.","Même règle pour la division."],"ex":["Calculer (−2) × 3 × (−1) × (−5).","Trois facteurs négatifs : nombre impair → résultat négatif.","2 × 3 × 1 × 5 = 30 → **−30**."],"p":"Appliquer la règle des signes à l'addition : (−3) + (−4) = −7, pas +7.","r":"Je compte d'abord les signes « − », puis je calcule avec les distances à zéro."},"4-frac":{"t":"Fractions : multiplier et diviser","e":["{a/b} × {c/d} = {a × c/b × d}. On simplifie **avant** de multiplier si possible.","Diviser par une fraction, c'est **multiplier par son inverse** : l'inverse de {c/d} est {d/c}.","Une fraction est **irréductible** quand on ne peut plus la simplifier."],"ex":["Calculer {3/5} ÷ {6/7}.","= {3/5} × {7/6}.","= {21/30} = **{7/10}**."],"p":"Multiplier en croix au lieu de multiplier « en ligne », ou oublier d'inverser la seconde fraction.","r":"Diviser par 2, c'est multiplier par {1/2} : la règle est la même avec toutes les fractions."},"4-pui":{"t":"Puissances de 10 et notation scientifique","e":["10^{n} = 1 suivi de n zéros. 10^{−n} : le chiffre 1 est au n-ième rang après la virgule : 10^{−3} = 0,001.","10^{a} × 10^{b} = 10^{a+b}.","**Notation scientifique** : a × 10^{n} avec 1 ≤ a < 10."],"ex":["Écrire 45 000 et 0,0072 en notation scientifique.","45 000 = **4,5 × 10^{4}**.","0,0072 = **7,2 × 10^{−3}**."],"p":"Écrire 45 × 10^{3} : c'est juste, mais ce n'est pas la notation scientifique (45 n'est pas entre 1 et 10).","r":"Je compte de combien de rangs la virgule se déplace pour obtenir un nombre entre 1 et 10."},"4-lit":{"t":"Développer, réduire, factoriser","e":["**Développer** : k(a + b) = ka + kb. On transforme un produit en somme.","**Réduire** : regrouper les termes de même nature : 5x + 2 − 3x + 7 = 2x + 9.","**Factoriser** : ka + kb = k(a + b). On transforme une somme en produit."],"ex":["Développer et réduire 3(x + 4) − 2x.","3(x + 4) = 3x + 12.","3x + 12 − 2x = **x + 12**."],"p":"Écrire 2x + 3 = 5x. On ne peut pas additionner des x et des nombres seuls.","r":"Je surligne d'une couleur les termes en x, d'une autre les nombres."},"4-eq":{"t":"Équations du premier degré","e":["Résoudre une équation, c'est trouver la ou les valeurs de x qui rendent l'égalité vraie.","On peut ajouter, soustraire, multiplier ou diviser (par un nombre non nul) les **deux membres** par le même nombre.","On vérifie toujours en remplaçant x par la solution trouvée."],"ex":["Résoudre 3x − 5 = 10.","On ajoute 5 : 3x = 15.","On divise par 3 : **x = 5**. Vérif : 3 × 5 − 5 = 10 ✓."],"p":"« Passer de l'autre côté » sans changer l'opération : 3x − 5 = 10 ne donne pas 3x = 5.","r":"Je fais la même opération des deux côtés, comme une balance qui reste en équilibre."},"4-rac":{"t":"Racine carrée","e":["√a (a positif) est le nombre **positif** dont le carré vaut a : √81 = 9 car 9² = 81.","Grâce aux carrés parfaits, on encadre : 49 < 50 < 64, donc 7 < √50 < 8.","La racine carrée sert surtout pour retrouver une longueur (Pythagore, aire d'un carré)."],"ex":["Un carré a une aire de 36 cm². Son côté ?","c² = 36.","c = √36 = **6 cm**."],"p":"Confondre racine carrée et moitié : √16 = 4, mais √36 ≠ 18.","r":"Je connais les carrés de 1 à 12 : ce sont mes points de repère."},"4-prog":{"t":"Programmes de calcul","e":["Un programme de calcul enchaîne des étapes. On peut l'appliquer à un nombre, puis à une lettre x pour obtenir une **expression**.","Pour **remonter** un programme, on effectue les opérations inverses dans l'ordre inverse."],"ex":["Choisir un nombre ; ajouter 3 ; multiplier par 2. On obtient 18.","On remonte : 18 ÷ 2 = 9.","9 − 3 = 6 → **le nombre de départ est 6**."],"p":"Remonter dans le même ordre que le programme.","r":"Avec x : (x + 3) × 2, je garde les parenthèses pour respecter l'ordre des étapes."},"4-q4":{"t":"Quatrième proportionnelle et graphiques","e":["Dans un tableau de proportionnalité, les « produits en croix » sont égaux : si {a/b} = {c/d}, alors a × d = b × c.","Quatrième proportionnelle : x = (b × c) ÷ a.","La représentation graphique d'une situation de proportionnalité est une droite passant par l'origine."],"ex":["5 L de peinture couvrent 40 m². Combien de litres pour 72 m² ?","Tableau : 5 → 40 ; x → 72.","x = 5 × 72 ÷ 40 = **9 L**."],"p":"Utiliser le produit en croix dans un tableau qui n'est pas proportionnel.","r":"Je vérifie d'abord que la situation est proportionnelle."},"4-vit":{"t":"Grandeurs quotients : vitesse","e":["v = {d/t} ; d = v × t ; t = {d/v}.","Conversion : 1 m/s = 3,6 km/h. On divise par 3,6 pour passer de km/h à m/s.","Attention aux durées : 1 h 30 min = 1,5 h."],"ex":["Un cycliste parcourt 45 km en 1 h 30 min.","t = 1,5 h.","v = 45 ÷ 1,5 = **30 km/h**."],"p":"Diviser par 1,30 au lieu de 1,5.","r":"Je convertis les durées en heures décimales avant de calculer."},"4-pyth":{"t":"Théorème de Pythagore","e":["Dans un triangle **rectangle**, le carré de l'hypoténuse est égal à la somme des carrés des deux autres côtés : BC² = AB² + AC² (rectangle en A).","**Réciproque** : si BC² = AB² + AC², alors le triangle est rectangle en A.","**Contraposée** : si BC² ≠ AB² + AC² (BC étant le plus grand côté), le triangle n'est pas rectangle."],"ex":["ABC rectangle en A, AB = 6 cm, AC = 8 cm.","BC² = 6² + 8² = 36 + 64 = 100.","BC = √100 = **10 cm**."],"p":"Additionner les carrés quand on cherche un côté de l'angle droit : on **soustrait** (AB² = BC² − AC²).","r":"J'identifie d'abord l'hypoténuse : c'est le côté en face de l'angle droit, le plus long."},"4-mil":{"t":"Théorème de la droite des milieux","e":["Dans un triangle, la droite qui passe par les **milieux de deux côtés** est **parallèle au troisième côté**.","Le segment qui joint ces deux milieux mesure la **moitié** du troisième côté.","Une droite qui passe par le milieu d'un côté et est parallèle à un deuxième coupe le troisième en son milieu."],"ex":["I milieu de [AB], J milieu de [AC], BC = 9 cm.","(IJ) ∥ (BC).","IJ = 9 ÷ 2 = **4,5 cm**."],"p":"Appliquer le théorème quand un seul des points est un milieu.","r":"Je vérifie que les deux points sont bien des milieux (codage sur la figure)."},"4-cerc":{"t":"Triangle rectangle et cercle circonscrit","e":["Un triangle est rectangle **si et seulement si** il est inscrit dans un cercle ayant pour diamètre un de ses côtés.","Le centre du cercle circonscrit d'un triangle rectangle est le **milieu de l'hypoténuse**.","La médiane issue de l'angle droit mesure la moitié de l'hypoténuse."],"ex":["M est sur le cercle de diamètre [AB], M ≠ A et M ≠ B.","[AB] est un diamètre du cercle circonscrit à ABM.","ABM est **rectangle en M**."],"p":"Dire que l'angle droit est en A ou en B : il est au sommet qui n'appartient pas au diamètre.","r":"Diamètre visible + point sur le cercle = angle droit au point."},"4-trans":{"t":"Translation","e":["La translation qui transforme A en B fait **glisser** toute figure dans la même direction, le même sens et de la même longueur que de A vers B.","Si la translation transforme A en B et C en D, alors **ABDC** est un parallélogramme (éventuellement aplati).","Une translation conserve les longueurs, les angles, les aires et le parallélisme."],"ex":["Translation qui transforme A en B ; image du point C ?","On trace D tel que ABDC soit un parallélogramme.","D est l'image de C : **[CD] a même direction, sens et longueur que [AB]**."],"p":"Nommer le parallélogramme ABCD au lieu de ABDC (l'ordre des sommets compte).","r":"Je dessine une flèche de A vers B et je la recopie à partir de chaque point."},"4-pyr":{"t":"Pyramide et cône : volumes","e":["Pyramide et cône : V = {aire de la base × hauteur/3}.","Cône de révolution : V = {π × r² × h/3}.","Une pyramide a le tiers du volume du prisme de même base et même hauteur."],"ex":["Cône de rayon 3 cm et de hauteur 4 cm.","π × 3² × 4 = 36π.","36π ÷ 3 = 12π ≈ **37,7 cm³**."],"p":"Oublier de diviser par 3.","r":"Pointe (pyramide, cône) → je divise par 3. Pas de pointe (prisme, cylindre) → non."},"4-stat":{"t":"Moyenne pondérée, médiane, étendue","e":["**Moyenne pondérée** : (somme des valeur × effectif) ÷ effectif total.","**Médiane** : valeur qui partage la série **rangée** en deux groupes de même effectif.","**Étendue** : plus grande valeur − plus petite valeur.","Une valeur extrême modifie beaucoup la moyenne, peu la médiane."],"ex":["Série : 3 ; 7 ; 8 ; 10 ; 15.","5 valeurs rangées → la 3e est la médiane : **8**.","Étendue : 15 − 3 = **12**."],"p":"Chercher la médiane sans ranger les valeurs.","r":"Effectif pair : la médiane est la moyenne des deux valeurs du milieu."},"4-proba":{"t":"Évènement contraire et deux épreuves","e":["L'évènement **contraire** de A (non A) se réalise quand A ne se réalise pas : P(non A) = 1 − P(A).","**Intersection** « A et B » ; **réunion** « A ou B ». Un évènement **impossible** correspond à l'ensemble vide.","Pour deux épreuves (deux pièces, deux dés…), on liste les issues avec un **tableau** ou un **arbre**."],"ex":["On lance deux pièces.","Issues : PP, PF, FP, FF (4 issues équiprobables).","P(deux piles) = **{1/4}** ; P(au moins une face) = 1 − {1/4} = **{3/4}**."],"p":"Oublier que PF et FP sont deux issues différentes.","r":"« Au moins un » → je pense à l'évènement contraire."},"4-info":{"t":"Variables et conditions","e":["Une **variable** est une case mémoire qui porte un nom et contient une valeur qui peut changer.","« Si … alors … sinon … » : le programme choisit une action selon une **condition**."],"ex":["Si note ≥ 10 alors dire « Validé » sinon dire « À retravailler ».","note = 12 → condition vraie.","Le lutin dit **« Validé »**."],"p":"Oublier d'initialiser la variable (lui donner une valeur de départ).","r":"Je suis la valeur de chaque variable ligne par ligne."},"3-arith":{"t":"Nombres premiers et décomposition","e":["Un nombre **premier** a exactement deux diviseurs : 1 et lui-même (2, 3, 5, 7, 11, 13, 17, 19, 23…). 1 n'est pas premier.","Tout entier ≥ 2 se décompose en produit de facteurs premiers, de façon unique.","Cela sert à **simplifier** une fraction jusqu'à la forme irréductible."],"ex":["Décomposer 84.","84 = 2 × 42 = 2 × 2 × 21 = 2 × 2 × 3 × 7.","**84 = 2² × 3 × 7**."],"p":"Dire que 1 est premier, ou que 51 est premier (51 = 3 × 17).","r":"Je divise par 2 tant que possible, puis par 3, 5, 7…"},"3-lit":{"t":"Double distributivité et factorisation","e":["**Double distributivité** : (a + b)(c + d) = ac + ad + bc + bd.","À connaître : (a + b)(a − b) = a² − b².","Factoriser par un facteur commun : 3x² + 6x = 3x(x + 2)."],"ex":["Développer (x + 2)(x + 3).","x × x + x × 3 + 2 × x + 2 × 3.","= x² + 3x + 2x + 6 = **x² + 5x + 6**."],"p":"Écrire (x + 3)² = x² + 9. Il manque le terme 6x : (x + 3)² = x² + 6x + 9.","r":"Chaque terme de la première parenthèse multiplie chaque terme de la seconde : 4 produits."},"3-eq":{"t":"Équations produit nul et inéquations","e":["**Produit nul** : un produit est nul si et seulement si l'un de ses facteurs est nul.","(x − 3)(2x + 8) = 0 ⇔ x − 3 = 0 **ou** 2x + 8 = 0.","Inéquation : mêmes règles qu'une équation, **mais** multiplier ou diviser par un nombre négatif **change le sens** de l'inégalité."],"ex":["Résoudre −2x + 1 < 7.","−2x < 6.","On divise par −2 (négatif) : **x > −3**."],"p":"Oublier de changer le sens de l'inégalité en divisant par un négatif.","r":"Je teste une valeur dans l'inéquation finale pour vérifier le sens."},"3-pui":{"t":"Puissances : règles de calcul","e":["a^{m} × a^{n} = a^{m+n} ; {a^{m}/a^{n}} = a^{m−n} ; (a^{m})^{n} = a^{m×n}.","a^{0} = 1 (a ≠ 0) ; a^{−n} = {1/a^{n}}.","Préfixes : kilo = 10^{3}, méga = 10^{6}, giga = 10^{9}, milli = 10^{−3}, micro = 10^{−6}, nano = 10^{−9}."],"ex":["Simplifier {10^{5} × 10^{−2}/10^{4}}.","Numérateur : 10^{3}.","10^{3−4} = **10^{−1} = 0,1**."],"p":"Multiplier les exposants au lieu de les additionner : 2^{3} × 2^{4} = 2^{7}, pas 2^{12}.","r":"Je reviens à la définition (combien de facteurs ?) si je doute d'une règle."},"3-fct":{"t":"Fonctions : image et antécédent","e":["Une **fonction** f associe à chaque nombre x un unique nombre f(x), appelé **image** de x. On écrit f : x ↦ f(x).","Si f(a) = b, alors a est **un antécédent** de b (il peut y en avoir plusieurs, ou aucun).","On lit images et antécédents dans un tableau, une formule ou un graphique (image sur l'axe vertical)."],"ex":["f(x) = 2x − 1. Image de 4 ? Antécédent de 5 ?","f(4) = 2 × 4 − 1 = **7**.","2x − 1 = 5 ⇔ x = **3**."],"p":"Inverser image et antécédent : l'image se lit sur l'axe des ordonnées.","r":"Image : je remplace x et je calcule. Antécédent : je résous une équation."},"3-aff":{"t":"Fonctions linéaires et affines","e":["**Linéaire** : f(x) = ax. Représentation : droite passant par l'origine. Elle traduit la **proportionnalité**.","**Affine** : f(x) = ax + b. Représentation : droite ; b est l'**ordonnée à l'origine**, a le **coefficient directeur**.","a = {f(x₂) − f(x₁)/x₂ − x₁} : quand x augmente de 1, f(x) augmente de a."],"ex":["f affine avec f(3) = 7 et f(5) = 11.","a = (11 − 7) ÷ (5 − 3) = 2.","7 = 2 × 3 + b → b = 1 : **f(x) = 2x + 1**."],"p":"Confondre a et b : dans f(x) = 3 − 2x, a = −2 et b = 3.","r":"Je lis b là où la droite coupe l'axe vertical, puis a en « avançant de 1 »."},"3-evo":{"t":"Pourcentages d'évolution","e":["Augmenter de t % ⇔ multiplier par (1 + {t/100}). Diminuer de t % ⇔ multiplier par (1 − {t/100}).","Évolutions successives : on **multiplie** les coefficients.","Une hausse de 20 % puis une baisse de 20 % ne ramènent **pas** au prix de départ."],"ex":["Un prix augmente de 20 % puis baisse de 20 %.","Coefficient global : 1,2 × 0,8 = 0,96.","Le prix a **baissé de 4 %**."],"p":"Additionner les pourcentages : +20 % puis −20 % ne fait pas 0 %.","r":"Je traduis chaque évolution en coefficient multiplicateur."},"3-thal":{"t":"Théorème de Thalès","e":["Si les points A, M, B et A, N, C sont alignés et (MN) ∥ (BC), alors {AM/AB} = {AN/AC} = {MN/BC}.","Deux configurations : triangles **emboîtés** ou **papillon**.","**Réciproque** : si {AM/AB} = {AN/AC} (points alignés dans le même ordre), alors (MN) ∥ (BC)."],"ex":["(MN) ∥ (BC), AM = 3, AB = 5, BC = 8. MN ?","{MN/8} = {3/5}.","MN = 8 × 3 ÷ 5 = **4,8**."],"p":"Mélanger les rapports : chaque rapport compare le petit triangle au grand (ou l'inverse), toujours dans le même ordre.","r":"J'écris les trois rapports, je barre celui qui ne sert pas, je fais un produit en croix."},"3-trig":{"t":"Trigonométrie dans le triangle rectangle","e":["Dans un triangle rectangle, pour un angle aigu : cos = {adjacent/hypoténuse} ; sin = {opposé/hypoténuse} ; tan = {opposé/adjacent}.","Moyen mnémotechnique : **SOH CAH TOA**.","Calculatrice en **mode degrés** ; touches cos⁻¹, sin⁻¹, tan⁻¹ (ou Arccos…) pour retrouver un angle."],"ex":["ABC rectangle en B, AB = 4, AC = 8. Angle Â ?","cos Â = {AB/AC} = {4/8} = 0,5.","Â = cos⁻¹(0,5) = **60°**."],"p":"Se tromper de côté adjacent : il touche l'angle mais ce n'est **pas** l'hypoténuse.","r":"Je repère l'angle, puis je nomme les trois côtés depuis cet angle avant de choisir la formule."},"3-vect":{"t":"Vecteurs","e":["Le vecteur [v:AB] est défini par une **direction**, un **sens** et une **longueur** : c'est la translation qui envoie A sur B.","[v:AB] = [v:CD] ⇔ ABDC est un parallélogramme (éventuellement aplati).","Vecteur nul : [v:AA]. Opposé : [v:BA] est l'opposé de [v:AB].","**Relation de Chasles** : [v:AB] + [v:BC] = [v:AC] (enchaîner deux translations)."],"ex":["Simplifier [v:MN] + [v:NP] + [v:PQ].","[v:MN] + [v:NP] = [v:MP].","[v:MP] + [v:PQ] = **[v:MQ]**."],"p":"Écrire [v:AB] + [v:CB] = [v:AC] : Chasles exige que la fin du premier soit le début du second.","r":"Je vérifie que les lettres « s'emboîtent » : A**B** + **B**C."},"3-esp":{"t":"Boule, sphère et sections","e":["Sphère de rayon r : aire = 4 × π × r². Boule : V = {4/3} × π × r³.","Section d'un pavé par un plan parallèle à une face ou à une arête : un **rectangle**.","Section d'une boule par un plan : un **cercle** (disque). Section d'une pyramide ou d'un cône parallèle à la base : une **réduction** de la base."],"ex":["Volume d'une boule de rayon 3 cm.","{4/3} × π × 27 = 36π.","≈ **113,1 cm³**."],"p":"Confondre aire (r²) et volume (r³).","r":"Je dessine la section en vraie grandeur à côté du solide."},"3-agr":{"t":"Agrandissement et réduction","e":["Dans un agrandissement ou une réduction de rapport k : longueurs × k ; aires × k² ; volumes × k³.","k > 1 : agrandissement. 0 < k < 1 : réduction.","Les angles sont conservés."],"ex":["On réduit une pyramide de 540 cm³ au rapport {1/3}.","Volumes × ({1/3})³ = × {1/27}.","540 ÷ 27 = **20 cm³**."],"p":"Multiplier un volume par k au lieu de k³.","r":"Je pense au cube : si je double son côté, il faut 8 petits cubes pour le remplir."},"3-stat":{"t":"Quartiles et boîte à moustaches","e":["**Effectifs cumulés croissants** : on ajoute les effectifs au fur et à mesure.","**Q1** : plus petite valeur telle qu'au moins 25 % des données lui soient inférieures ou égales. **Q3** : idem avec 75 %.","**Boîte à moustaches** : minimum, Q1, médiane, Q3, maximum. Elle permet de **comparer** deux séries."],"ex":["Série rangée : 2 ; 4 ; 5 ; 7 ; 8 ; 10 ; 12 ; 15 (8 valeurs).","25 % de 8 = 2 → Q1 = 2e valeur = **4**. 75 % de 8 = 6 → Q3 = 6e valeur = **10**.","Médiane : (7 + 8) ÷ 2 = **7,5**."],"p":"Prendre pour Q1 la médiane de la première moitié : au collège, on applique la définition avec 25 %.","r":"Je range, je calcule 25 % et 75 % de l'effectif, j'arrondis au rang supérieur."},"3-proba":{"t":"Probabilités : réunion, intersection, fréquences","e":["P(A ∪ B) + P(A ∩ B) = P(A) + P(B).","Quand on répète une expérience un grand nombre de fois, la **fréquence** d'un évènement se **stabilise** autour de sa probabilité.","On peut **simuler** une expérience (tableur, Scratch) pour observer cette stabilisation."],"ex":["Dé équilibré : A « pair », B « ≥ 4 ».","P(A) = {1/2}, P(B) = {1/2}, A ∩ B = {4 ; 6} → {1/3}.","P(A ∪ B) = {1/2} + {1/2} − {1/3} = **{2/3}**."],"p":"Additionner P(A) et P(B) sans retirer les issues comptées deux fois.","r":"Je liste les issues de A ∪ B pour vérifier : ici {2 ; 4 ; 5 ; 6}, soit {4/6}."},"3-info":{"t":"Boucles conditionnelles et conditions composées","e":["« Répéter jusqu'à … » : la boucle tourne tant que la condition n'est pas vérifiée (nombre de tours inconnu à l'avance).","Conditions composées : « **et** » (les deux doivent être vraies), « **ou** » (au moins une)."],"ex":["n = 1 ; répéter jusqu'à n > 20 : mettre n à n × 2.","n prend les valeurs 2, 4, 8, 16, 32.","La boucle s'arrête à **n = 32**."],"p":"Écrire une condition qui ne devient jamais vraie : boucle infinie.","r":"Je vérifie que la variable de la condition change à chaque tour."}},"formulaire":[{"t":"Périmètres","n":"6e","f":[["Carré","4 × c"],["Rectangle","2 × (L + l)"],["Cercle","2 × π × r = π × d"]]},{"t":"Aires","n":"6e","f":[["Carré","c × c = c²"],["Rectangle","L × l"],["Triangle rectangle","{a × b/2}"],["Disque","π × r²"]]},{"t":"Aires (suite)","n":"5e","f":[["Triangle","{b × h/2}"],["Parallélogramme","b × h"],["Losange","{D × d/2}"]]},{"t":"Volumes","n":"6e","f":[["Cube","c³"],["Pavé droit","L × l × h"]]},{"t":"Volumes (suite)","n":"5e","f":[["Prisme droit","aire de base × h"],["Cylindre","π × r² × h"]]},{"t":"Volumes (pointes)","n":"4e","f":[["Pyramide","{aire de base × h/3}"],["Cône","{π × r² × h/3}"]]},{"t":"Sphère et boule","n":"3e","f":[["Aire de la sphère","4 × π × r²"],["Volume de la boule","{4/3} × π × r³"]]},{"t":"Contenances","n":"6e","f":[["1 dm³","1 L"],["1 cm³","1 mL"],["1 m³","1 000 L"]]},{"t":"Vitesse","n":"4e","f":[["Vitesse","v = {d/t}"],["Conversion","1 m/s = 3,6 km/h"]]},{"t":"Triangle rectangle","n":"4e","f":[["Pythagore","BC² = AB² + AC²"],["cos","{adj/hyp}"],["sin","{opp/hyp}"],["tan","{opp/adj}"]]},{"t":"Calcul littéral","n":"4e","f":[["Simple distributivité","k(a + b) = ka + kb"],["Double distributivité","(a + b)(c + d) = ac + ad + bc + bd"],["Différence de carrés","(a + b)(a − b) = a² − b²"]]},{"t":"Évolutions","n":"3e","f":[["Hausse de t %","× (1 + {t/100})"],["Baisse de t %","× (1 − {t/100})"],["Agrandissement k","longueurs × k ; aires × k² ; volumes × k³"]]}]}</script>
<script>
'use strict';
/* ===== Outils ===== */
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){var b=a.slice(),i,j,t;for(i=b.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=b[i];b[i]=b[j];b[j]=t;}return b;}
function rd(x,n){var p=Math.pow(10,n===undefined?6:n);return Math.round(x*p)/p;}
function fmt(x){x=rd(x,6);var neg=x<0,s=String(Math.abs(x)),p=s.split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ');return (neg?'−':'')+p.join(',');}
function par(x){return x<0?'('+fmt(x)+')':fmt(x);}
function sg(x){return x<0?' − '+fmt(-x):' + '+fmt(x);}
function fr(n,d){return '<span class="fr"><span>'+n+'</span><span>'+d+'</span></span>';}
function sup(b,e){return b+'<sup>'+e+'</sup>';}
function ex(e){return e<0?'−'+(-e):String(e);}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a;}
function aff(a,b){var s=a===1?'x':(a===-1?'−x':fmt(a)+'x');if(b!==0)s+=sg(b);return s;}
function near(a,b){return Math.abs(a-b)<1e-6*Math.max(1,Math.abs(b));}
function N(o){o.type='num';var t=o.traps||[],k=[],i;for(i=0;i<t.length;i++)if(isFinite(t[i][0])&&!near(t[i][0],o.ans)&&!(o.tol&&Math.abs(t[i][0]-o.ans)<=o.tol))k.push(t[i]);o.traps=k;return o;}
function C(o){o.type='qcm';var t=o.traps||[],k=[],u={},b=[],i;u[o.good]=1;for(i=0;i<o.bad.length;i++)if(!u[o.bad[i]]){u[o.bad[i]]=1;b.push(o.bad[i]);}for(i=0;i<t.length;i++)if(t[i][0]!==o.good)k.push(t[i]);o.traps=k;o.choices=o.order?o.order.slice():shuffle([o.good].concat(b));return o;}
/* choisit une variante au hasard */
function V(){return arguments[Math.floor(Math.random()*arguments.length)]();}
function prog(lines){return '<div class="code">'+lines.join('<br>')+'</div>';}
var PI='3,14';
function vec(s){return '<span class="vec">'+s+'</span>';}

/* ===== Figures SVG (non à l'échelle) ===== */
function svgRect(b,c){
 return '<svg class="fig" viewBox="0 0 320 185" role="img" aria-label="Rectangle"><rect x="60" y="25" width="190" height="110" class="s"/>'+
 '<text x="155" y="162" text-anchor="middle">'+b+'</text><text x="262" y="86" text-anchor="start">'+c+'</text></svg>';
}
function svgBox(a,b,c){
 return '<svg class="fig" viewBox="0 0 320 200" role="img" aria-label="Pavé droit"><path class="s" d="M50 70 L200 70 L200 170 L50 170 Z"/><path class="s" d="M50 70 L100 30 L250 30 L200 70 Z"/><path class="s" d="M200 70 L250 30 L250 130 L200 170 Z"/>'+
 '<path class="d" d="M50 170 L100 130 L250 130 M100 130 L100 30"/>'+
 '<text x="125" y="192" text-anchor="middle">'+a+'</text><text x="236" y="168" text-anchor="start">'+b+'</text><text x="42" y="125" text-anchor="end">'+c+'</text></svg>';
}
function svgRT(n,ab,bc,ac,ang){
 var s='<svg class="fig" viewBox="0 0 320 200" role="img" aria-label="Triangle rectangle en '+n[1]+'">'+
 '<path class="s" d="M80 25 L80 165 L270 165 Z"/><path class="k" d="M80 148 L97 148 L97 165"/>'+
 '<text x="70" y="22" text-anchor="end">'+n[0]+'</text><text x="70" y="182" text-anchor="end">'+n[1]+'</text><text x="278" y="182" text-anchor="start">'+n[2]+'</text>';
 if(ab)s+='<text class="v" x="70" y="100" text-anchor="end">'+ab+'</text>';
 if(bc)s+='<text class="v" x="175" y="190" text-anchor="middle">'+bc+'</text>';
 if(ac)s+='<text class="v" x="185" y="85" text-anchor="start">'+ac+'</text>';
 if(ang)s+='<path class="a" d="M80 60 A35 35 0 0 0 102 52"/><text x="98" y="78" text-anchor="start" style="font-size:14px;fill:#c0392b">'+ang+'</text>';
 return s+'</svg>';
}
function svgTriH(b,h){
 return '<svg class="fig" viewBox="0 0 320 200" role="img" aria-label="Triangle et hauteur"><path class="s" d="M120 25 L40 160 L280 160 Z"/>'+
 '<path class="d" d="M120 25 L120 160"/><path class="k" d="M120 146 L134 146 L134 160"/>'+
 '<text x="160" y="185" text-anchor="middle">'+b+'</text><text class="v" x="112" y="105" text-anchor="end">'+h+'</text></svg>';
}
function svgPara(b,h){
 return '<svg class="fig" viewBox="0 0 320 190" role="img" aria-label="Parallélogramme et hauteur"><path class="s" d="M40 150 L220 150 L280 40 L100 40 Z"/>'+
 '<path class="d" d="M100 40 L100 150"/><path class="k" d="M100 136 L114 136 L114 150"/>'+
 '<text x="130" y="175" text-anchor="middle">'+b+'</text><text class="v" x="108" y="100" text-anchor="start">'+h+'</text></svg>';
}
function svgThales(n,mid){
 return '<svg class="fig" viewBox="0 0 320 200" role="img" aria-label="Triangle et droite parallèle"><path class="s" d="M160 20 L35 175 L285 175 Z"/>'+
 '<path class="l" d="M98 97 L222 97"/>'+(mid?'<path class="k" d="M64 136 l8 -6 M66 140 l8 -6 M126 58 l8 -6 M128 62 l8 -6 M186 52 l8 6 M184 56 l8 6 M248 132 l8 6 M246 136 l8 6"/>':'')+
 '<text x="160" y="15" text-anchor="middle">'+n[0]+'</text><text x="86" y="95" text-anchor="end">'+n[1]+'</text><text x="234" y="95" text-anchor="start">'+n[2]+'</text>'+
 '<text x="30" y="192" text-anchor="middle">'+n[3]+'</text><text x="290" y="192" text-anchor="middle">'+n[4]+'</text></svg>';
}
/* droite graduée : 11 graduations de v0 en v0 + 10*st, étiquettes aux graduations la et lb, point P à la graduation k */
function svgAxis(v0,st,la,lb,k,name){
 var s='<svg class="fig" viewBox="0 0 320 90" role="img" aria-label="Droite graduée"><path class="l" d="M10 50 L312 50"/><path class="l" d="M304 44 L312 50 L304 56"/>',i,x;
 for(i=0;i<=10;i++){x=20+i*28;s+='<path class="k" d="M'+x+' 43 L'+x+' 57"/>';if(i===la||i===lb)s+='<text x="'+x+'" y="80" text-anchor="middle">'+fmt(rd(v0+i*st,4))+'</text>';}
 x=20+k*28;return s+'<circle cx="'+x+'" cy="50" r="6" fill="#c0392b"/><text class="v" x="'+x+'" y="30" text-anchor="middle">'+name+'</text></svg>';
}
/* repère orthogonal de −5 à 5 */
function svgGrid(pts){
 var s='<svg class="fig" viewBox="0 0 300 300" role="img" aria-label="Repère">',i,c;
 for(i=-5;i<=5;i++){c=150+i*26;s+='<path d="M'+c+' 20 L'+c+' 280 M20 '+c+' L280 '+c+'" stroke="#e3d3b0" stroke-width="1"/>';}
 s+='<path class="l" d="M20 150 L284 150 M150 280 L150 16" /><text x="138" y="168" text-anchor="middle" style="font-size:13px">0</text><text x="176" y="168" text-anchor="middle" style="font-size:13px">1</text><text x="140" y="129" text-anchor="end" style="font-size:13px">1</text>';
 for(i=0;i<pts.length;i++){var X=150+pts[i].x*26,Y=150-pts[i].y*26;s+='<circle cx="'+X+'" cy="'+Y+'" r="6" fill="#c0392b"/><text class="v" x="'+(X+8)+'" y="'+(Y-8)+'">'+pts[i].n+'</text>';}
 return s+'</svg>';
}
/* diagramme en barres */
function svgBars(lab,val,unit){
 var mx=0,i,s,step;for(i=0;i<val.length;i++)if(val[i]>mx)mx=val[i];step=mx>40?10:(mx>20?5:2);var top=Math.ceil(mx/step)*step,H=170,w=240/val.length;

function st(id){return P().skills[id]||{l:0,ld:0,ok:0,c:0,cd:0,cc:0};}

function canUp(s){if(s.l===0)return true;if(s.l===1)return today()>s.ld;if(s.l===2)return today()-s.ld>=3;return false;}
function waitDays(s){return s.l===1?s.ld+1-today():s.ld+3-today();}
function care(s){return s.l>0&&today()-s.ok>=CARE_DAYS;}

function status(id){
 var s=st(id);
 if(s.l===0)return {t:'Nouvelle mission',c:'muted'};
 if(care(s))return {t:'🔧 À entretenir',c:'warn'};
 if(s.l===3)return {t:'✨ Maîtrise en or',c:'gold'};
 if(canUp(s))return {t:'⬆️ Prêt pour l’'+MEDN[s.l+1]+' !',c:'up'};
 var w=waitDays(s);return {t:'⏳ '+MEDN[s.l+1].charAt(0).toUpperCase()+MEDN[s.l+1].slice(1)+(w<=1?' possible demain':' possible dans '+w+' jours'),c:'muted'};

/* mini-balisage des fiches : **gras**, {a/b} fraction, ^{n} exposant, [v:AB] vecteur */
function braceEnd(s,i){var d=0,j;for(j=i;j<s.length;j++){var c=s.charAt(j);if(c==='{')d++;else if(c==='}'){d--;if(d===0)return j;}}return -1;}
function topSlash(s){var d=0,j,c;for(j=0;j<s.length;j++){c=s.charAt(j);if(c==='{')d++;else if(c==='}')d--;else if(c==='/'&&d===0)return j;}return -1;}
function mk(s){s=String(s);var o='',i=0,b=false,c,e,inn,sl;
 while(i<s.length){c=s.charAt(i);
  if(c==='*'&&s.charAt(i+1)==='*'){o+=b?'</b>':'<b>';b=!b;i+=2;continue;}
  if(c==='^'&&s.charAt(i+1)==='{'){e=braceEnd(s,i+1);if(e>0){o+='<sup>'+mk(s.substring(i+2,e))+'</sup>';i=e+1;continue;}}
  if(c==='{'){e=braceEnd(s,i);if(e>0){inn=s.substring(i+1,e);sl=topSlash(inn);if(sl>=0){o+=fr(mk(inn.substring(0,sl)),mk(inn.substring(sl+1)));i=e+1;continue;}}}
  if(c==='['&&s.substr(i,3)==='[v:'){e=s.indexOf(']',i);if(e>0){o+=vec(esc(s.substring(i+3,e)));i=e+1;continue;}}
  o+=esc(c);i++;}
 return b?o+'</b>':o;}

function parseNum(raw){
 var s=String(raw).replace(/[−–]/g,'-').replace(/\s| /g,'').replace(/,/g,'.').toLowerCase();
 s=s.replace(/^[a-z]{1,3}=/,'');
 s=s.replace(/(km\/h|m\/s|cm²|cm2|m²|m2|dm²|cm³|cm3|m³|m3|mm|cm|dm|km|kg|cl|ml|g|m|l|€|euros?|pièces?|°c|°|%|h|min|s)$/,'');
 if(!/^[+-]?(\d+\.?\d*|\.\d+)(\/[+-]?(\d+\.?\d*|\.\d+))?$/.test(s))return NaN;
 if(s.indexOf('/')>=0){var a=s.split('/'),d=parseFloat(a[1]);return d===0?NaN:parseFloat(a[0])/d;}
 return parseFloat(s);
}
function same(a,b){return isFinite(a)&&Math.abs(a-b)<1e-6*Math.max(1,Math.abs(b));}
function judge(q,raw,sel){

 if(q.type==='qcm'){var c=q.choices[sel];ok=c===q.good;if(!ok)for(i=0;i<q.traps.length;i++)if(q.traps[i][0]===c)trap=q.traps[i][1];}
 else{var v=parseNum(raw);ok=q.tol?(isFinite(v)&&Math.abs(v-q.ans)<=q.tol+1e-9):same(v,q.ans);if(!ok)for(i=0;i<q.traps.length;i++)if(same(v,q.traps[i][0]))trap=q.traps[i][1];}
 return {ok:ok,trap:trap};
}

 var qd=0;for(var q in p.quests)if(p.quests[q].won)qd++;
 var h='<section class="panel"><img class="guide" src="assets/milo.webp" alt="Milo"><h1>💎 Le trésor de '+esc(p.name)+'</h1><p style="font-size:18px">👑 <b>'+esc(T.t.n)+'</b></p>';
 if(T.next){var span=T.next.min-T.t.min;h+='<div class="progress" style="max-width:420px"><div style="width:'+Math.round(100*(T.pts-T.t.min)/span)+'%"></div></div><p class="small muted">Encore '+(T.next.min-T.pts)+' point(s) de médaille pour devenir <b>'+esc(T.next.n)+'</b> (bronze = 1, argent = 2, or = 3).</p>';}
 h+='<div class="statgrid" style="clear:both;margin-top:12px"><div class="stat">'+spr('coin',30)+'<b>'+p.coins+'</b>pièces</div><div class="stat">'+spr('m1',30)+'<b>'+mc[1]+'</b>bronze</div><div class="stat">'+spr('m2',30)+'<b>'+mc[2]+'</b>argent</div><div class="stat">'+spr('m3',30)+'<b>'+mc[3]+'</b>or</div><div class="stat">'+spr('chest',30)+'<b>'+nb+' / '+BLD.length+'</b>bâtiments</div><div class="stat">'+spr('trophy',30)+'<b>'+qd+' / '+QS.length+'</b>quêtes</div></div>';
 h+='<h2>🛡️ Tes blasons</h2><p class="muted small">Chaque blason se remplit avec les médailles de son domaine, toutes classes confondues.</p><div class="blasons">';
 for(var d in DATA.domains){var ss=filter(SK,function(s){return s.d===d;}),got=sum(ss,function(s){return st(s.id).l;}),pc=Math.round(100*got/(ss.length*3));
  h+='<div class="blason">'+shield(d,90,pc+'%')+'<b>'+esc(DATA.domains[d].name)+'</b><span class="small muted">'+got+' / '+(ss.length*3)+' ★</span></div>';}
 h+='</div></section>';
 h+='<section class="panel"><h2 style="margin-top:0">👤 Profils de cet appareil</h2><p class="small muted">Plusieurs élèves peuvent jouer sur le même appareil : chacun son profil.</p><div class="row">';
 each(db.profiles,function(x){h+='<button class="btn '+(x.id===db.activeId?'':'alt')+'" data-act="prof" data-id="'+esc(x.id)+'">'+esc(x.name)+(x.id===db.activeId?' ✓':'')+'</button>';});
 h+='</div><div class="row" style="margin-top:12px"><input id="newName" class="answer sm" maxlength="35" placeholder="Prénom du nouveau profil"><button class="btn" data-act="addprof">➕ Créer</button></div>';
 h+='<h2>⚙️ Profil actif</h2><div class="row"><label for="rename"><b>Prénom</b></label><input id="rename" class="answer sm" maxlength="35" value="'+esc(p.name)+'"><button class="btn alt" data-act="rename">Renommer</button></div>';
 h+='<div class="row" style="margin-top:10px"><label for="gradeSel"><b>Ma classe</b></label><select id="gradeSel" class="answer sm">';each(DATA.grades,function(g){h+='<option value="'+g.id+'"'+(p.grade===g.id?' selected':'')+'>'+g.id+' — '+esc(g.name)+'</option>';});
 h+='</select></div><p class="small muted">Lina te propose en priorité les missions de ta classe.</p>';
 h+='<p><button class="btn alt" data-act="go" data-p="prog">📋 Voir le programme de ma classe</button></p><h2>💾 Sauvegarde</h2><p>Ta progression est enregistrée dans ce navigateur. Pour la garder en sécurité ou changer d’appareil, utilise le <b>bouton 💾</b> en bas de l’écran : il exporte ou importe un fichier de sauvegarde.</p>';
 h+='<div class="actions">'+(db.profiles.length>1?'<button class="btn danger" data-act="delprof">Supprimer ce profil</button>':'')+'<button class="btn danger" data-act="reset">Tout réinitialiser</button></div></section>';
 return h;
}

/* ===== Actions (délégation d'évènements) ===== */
function act(a,el){
 var p=P();
 if(a==='go'){if(el.getAttribute('data-p')==='grimoire'&&page!=='grimoire')grG=p.grade;if(el.getAttribute('data-p')==='prog'&&page==='tresor')terr=p.grade;go(el.getAttribute('data-p'));}
 else if(a==='terr')go('terr',el.getAttribute('data-g'));
 else if(a==='fiche')openFiche(el.getAttribute('data-id'));
 else if(a==='sclose')closeSheet();
 else if(a==='grg'){grG=el.getAttribute('data-g');render();}
 else if(a==='progg'){terr=el.getAttribute('data-g');render();window.scrollTo(0,0);}
 else if(a==='mission'){stopTimer();startMission(el.getAttribute('data-id'));}
 else if(a==='check'){if(page==='mission')answerMission(-1);else if(page==='quest')answerQuest(-1);}
 else if(a==='pick'){var i=+el.getAttribute('data-i');if(page==='mission')answerMission(i);else if(page==='quest')answerQuest(i);else if(page==='exam'){exam.sel=i;exam.typed='';each(document.querySelectorAll('.choice'),function(b,k){b.className='choice'+(k===i?' sel':'');});}}
 else if(a==='next'){if(page==='mission')nextMission();else nextQuest();}
 else if(a==='hint'){var hb=$('hintbox');if(hb){hb.className='hintbox';el.setAttribute('disabled','disabled');}}
 else if(a==='key'){var inp=$('ans');if(inp&&!inp.disabled){var k=el.getAttribute('data-k'),v=inp.value;if(k==='-'){inp.value=v.charAt(0)==='-'?v.slice(1):'-'+v;}else inp.value=v+k;inp.focus();}}
 else if(a==='build')build(el.getAttribute('data-b'));
 else if(a==='quest')startQuest(el.getAttribute('data-id'));
 else if(a==='qgo'){qrun.i=0;render();window.scrollTo(0,0);}
 else if(a==='exam')startExam(el.getAttribute('data-k'));
 else if(a==='enext')examNext(false);
 else if(a==='eskip')examNext(true);
 else if(a==='prof'){db.activeId=el.getAttribute('data-id');save();render();toast('👤 Profil : '+esc(P().name));}
 else if(a==='addprof'){var nm=($('newName').value||'').replace(/^\s+|\s+$/g,'');if(!nm){toast('Écris un prénom.');return;}if(db.profiles.length>=40){toast('40 profils maximum.');return;}var np=blank(nm.slice(0,35));np.grade=p.grade;db.profiles.push(np);db.activeId=np.id;save();render();toast('👤 Bienvenue, '+esc(np.name)+' !');}
 else if(a==='rename'){var rn=($('rename').value||'').replace(/^\s+|\s+$/g,'');if(rn){p.name=rn.slice(0,35);save();render();toast('✏️ Prénom modifié');}}
 else if(a==='delprof')modal('<h2>Supprimer « '+esc(p.name)+' » ?</h2><p>Toute sa progression sera effacée. Pense à exporter avec 💾 avant.</p>',[{t:'Annuler',c:'alt'},{t:'Supprimer',c:'danger',f:function(){db.profiles=filter(db.profiles,function(x){return x.id!==p.id;});db.activeId=db.profiles[0].id;save();render();}}]);
 else if(a==='reset')modal('<h2>Tout réinitialiser ?</h2><p>Tous les profils et toutes les progressions de cet appareil seront effacés.</p>',[{t:'Annuler',c:'alt'},{t:'Oui, tout effacer',c:'danger',f:function(){setTimeout(function(){modal('<h2>Dernière confirmation</h2><p>Cette action est définitive.</p>',[{t:'Annuler',c:'alt'},{t:'Effacer définitivement',c:'danger',f:function(){db=fresh();save();go('home');}}]);},50);}}]);
 else if(a==='mb'){var b=MB[+el.getAttribute('data-i')];closeModal();if(b&&b.f)b.f();}
}
document.addEventListener('click',function(e){var el=e.target;while(el&&el!==document&&!(el.getAttribute&&el.getAttribute('data-act')))el=el.parentNode;if(!el||el===document)return;if(el.tagName==='A')return;e.preventDefault();act(el.getAttribute('data-act'),el);});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'&&$('sheet').className==='on'){closeSheet();return;}
 if(e.key==='Escape'&&$('modal').className==='on'){closeModal();return;}
 if($('sheet').className==='on')return;
 if(e.key!=='Enter')return;var t=e.target;
 if(t&&t.id==='ans'){e.preventDefault();if(page==='exam')examNext(false);else act('check',t);}
 else if(t&&t.id==='newName'){e.preventDefault();act('addprof',t);}
 else if(t&&t.id==='rename'){e.preventDefault();act('rename',t);}
});
document.addEventListener('change',function(e){if(e.target&&e.target.id==='gradeSel'){P().grade=e.target.value;save();toast('🎓 Classe : '+e.target.value);}});
document.addEventListener('input',function(e){if(e.target&&e.target.id==='ans'&&page==='exam')exam.typed=e.target.value;});
$('modal').addEventListener('click',function(e){if(e.target===$('modal'))closeModal();});
$('sheet').addEventListener('click',function(e){if(e.target===$('sheet'))closeSheet();});

render();
if(window.__b2yImportOk)toast('💾 Sauvegarde importée !');


</script>
</body>
</html>
