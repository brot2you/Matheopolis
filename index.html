</style></head><body><header class="top"><div class="head"><div class="brand" role="img" aria-label="Mathéopolis by BROT2YOU"></div><nav class="nav"><button class="secondary" data-page="home">🏠 Royaume</button><button class="secondary" data-page="learn">📚 Apprendre</button><button class="secondary" data-page="brevet">🏆 Brevet</button><button class="secondary" data-page="profile">👤 Profil</button><button class="secondary" data-page="save">💾 Sauvegardes</button></nav></div></header><main class="shell" id="app" aria-live="polite"></main><footer>Mathéopolis V1.1 · by BROT2YOU · Apprends, comprends, construis !</footer><input type="file" id="importFile" accept=".json,application/json" class="hidden"><script>
'use strict';
const KEY='matheopolis_v1',VERSION=1;
const grades=[{id:'6e',name:'Village des Fondations',emoji:'🏡',desc:'Nombres, fractions, mesures et géométrie'},{id:'5e',name:'Cité des Bâtisseurs',emoji:'🏘️',desc:'Relatifs, proportionnalité et premiers calculs littéraux'},{id:'4e',name:'Tours du Raisonnement',emoji:'🗼',desc:'Puissances, Pythagore et équations'},{id:'3e',name:'Citadelle des Experts',emoji:'🏰',desc:'Fonctions, Thalès, trigonométrie et brevet'}];
// Each template creates a new randomized exercise with an exact numerical answer.
const T=[
{id:'6e-add',grade:'6e',domain:'Nombres et calculs',title:'Addition de décimaux',lesson:'Pour additionner des nombres décimaux, aligne les virgules. Calcule ensuite colonne par colonne.',gen:()=>{let a=ri(12,85)/10,b=ri(12,65)/10;return q(`${a} + ${b} = ?`,+(a+b).toFixed(2),`Aligne les virgules : ${a} + ${b} = ${(a+b).toFixed(2).replace('.',',')}.`)}},
{id:'6e-frac',grade:'6e',domain:'Fractions',title:'Fractions d’une quantité',lesson:'Pour trouver une fraction d’une quantité, divise par le dénominateur puis multiplie par le numérateur.',gen:()=>{let d=ri(2,6),n=ri(1,d-1),k=ri(2,9);return q(`Combien vaut ${n}/${d} de ${d*k} ?`,n*k,`${d*k} ÷ ${d} × ${n} = ${n*k}.`)}},
{id:'6e-perim',grade:'6e',domain:'Grandeurs et mesures',title:'Périmètre du rectangle',lesson:'Le périmètre d’un rectangle est la somme des longueurs de ses quatre côtés : P = 2 × (L + l).',gen:()=>{let a=ri(3,14),b=ri(2,9);return q(`Un rectangle mesure ${a} cm sur ${b} cm. Quel est son périmètre en cm ?`,2*(a+b),`2 × (${a} + ${b}) = ${2*(a+b)} cm.`)}},
{id:'6e-angle',grade:'6e',domain:'Géométrie',title:'Angles complémentaires',lesson:'Deux angles complémentaires ont une somme de 90°.',gen:()=>{let a=ri(2,8)*10;return q(`Quel angle en degrés complète ${a}° pour obtenir 90° ?`,90-a,`90 − ${a} = ${90-a}°.`)}},
{id:'5e-neg',grade:'5e',domain:'Nombres relatifs',title:'Calculer avec des relatifs',lesson:'Sur une droite graduée, ajouter un nombre négatif revient à se déplacer vers la gauche.',gen:()=>{let a=ri(-15,15),b=ri(-12,-1);return q(`${a} + (${b}) = ?`,a+b,`${a} + (${b}) = ${a+b}.`)}},
{id:'5e-pct',grade:'5e',domain:'Proportionnalité',title:'Pourcentages simples',lesson:'Pour calculer 10 %, on divise par 10. Pour 20 %, on calcule deux fois 10 %.',gen:()=>{let p=[10,20,25,50][ri(0,3)],base=ri(2,12)*20;return q(`Combien font ${p} % de ${base} ?`,base*p/100,`${base} × ${p}/100 = ${base*p/100}.`)}},
{id:'5e-priority',grade:'5e',domain:'Calculs',title:'Priorités opératoires',lesson:'Sans parenthèses, les multiplications sont prioritaires sur les additions.',gen:()=>{let a=ri(2,12),b=ri(2,8),c=ri(2,9);return q(`${a} + ${b} × ${c} = ?`,a+b*c,`D’abord ${b} × ${c} = ${b*c}, puis ${a} + ${b*c} = ${a+b*c}.`)}},
{id:'5e-area',grade:'5e',domain:'Géométrie',title:'Aire du triangle',lesson:'L’aire d’un triangle vaut base × hauteur ÷ 2.',gen:()=>{let b=ri(2,12)*2,h=ri(2,12);return q(`Triangle : base ${b} cm, hauteur ${h} cm. Aire en cm² ?`,b*h/2,`${b} × ${h} ÷ 2 = ${b*h/2} cm².`)}},
{id:'4e-power',grade:'4e',domain:'Puissances',title:'Puissances de 10',lesson:'10ⁿ vaut 1 suivi de n zéros pour un entier n positif.',gen:()=>{let n=ri(2,5);return q(`10 puissance ${n} = ?`,10**n,`10^${n} = ${10**n}.`)}},
{id:'4e-pyth',grade:'4e',domain:'Géométrie',title:'Théorème de Pythagore',lesson:'Dans un triangle rectangle, le carré de l’hypoténuse est égal à la somme des carrés des deux autres côtés.',gen:()=>{let m=ri(1,4),a=3*m,b=4*m,c=5*m;return q(`Triangle rectangle : côtés de l’angle droit ${a} cm et ${b} cm. Hypoténuse en cm ?`,c,`√(${a}² + ${b}²) = √${c*c} = ${c} cm.`)}},
{id:'4e-eq',grade:'4e',domain:'Algèbre',title:'Résoudre une équation',lesson:'Pour résoudre ax + b = c, soustrais b aux deux membres puis divise par a.',gen:()=>{let x=ri(-8,10),a=ri(2,7),b=ri(1,15);return q(`Résous : ${a}x + ${b} = ${a*x+b}. Quelle est la valeur de x ?`,x,`${a}x = ${a*x}, donc x = ${x}.`)}},
{id:'4e-speed',grade:'4e',domain:'Grandeurs',title:'Vitesse moyenne',lesson:'La vitesse moyenne est la distance divisée par la durée.',gen:()=>{let t=ri(2,5),v=ri(3,12)*10;return q(`Un trajet de ${t*v} km dure ${t} h. Vitesse moyenne en km/h ?`,v,`${t*v} ÷ ${t} = ${v} km/h.`)}},
{id:'3e-prime',grade:'3e',domain:'Arithmétique',title:'Plus grand diviseur commun',lesson:'Le PGCD est le plus grand entier qui divise les deux nombres.',gen:()=>{let d=ri(2,10),a=d*ri(2,8),b=d*ri(2,8);return q(`Quel est le PGCD de ${a} et ${b} ?`,gcd(a,b),`Le plus grand diviseur commun de ${a} et ${b} est ${gcd(a,b)}.`)}},
{id:'3e-affine',grade:'3e',domain:'Fonctions',title:'Images par une fonction affine',lesson:'Pour f(x) = ax + b, remplace x par sa valeur puis calcule.',gen:()=>{let a=ri(-5,6)||2,b=ri(-9,9),x=ri(-4,7);return q(`Si f(x) = ${a}x + (${b}), calcule f(${x}).`,a*x+b,`${a} × ${x} + (${b}) = ${a*x+b}.`)}},
{id:'3e-thales',grade:'3e',domain:'Géométrie',title:'Rapports de Thalès',lesson:'Dans une configuration de Thalès, les longueurs correspondantes sont proportionnelles.',gen:()=>{let k=ri(2,5),a=ri(2,8),b=ri(2,8);return q(`Deux triangles de Thalès ont un rapport d’agrandissement ${k}. Un côté mesure ${a} cm dans le petit triangle. Longueur correspondante dans le grand ?`,k*a,`${a} × ${k} = ${a*k} cm.`)}},
{id:'3e-proba',grade:'3e',domain:'Probabilités',title:'Probabilité simple',lesson:'Si les issues sont équiprobables, probabilité = cas favorables ÷ cas possibles.',gen:()=>{let d=[2,4,5,10][ri(0,3)],n=ri(1,d-1);return q(`Une urne contient ${d} boules, dont ${n} rouges. Probabilité de tirer une rouge (en décimal) ?`,n/d,`${n}/${d} = ${+(n/d).toFixed(4)}.`)}},
];
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}function gcd(a,b){while(b){[a,b]=[b,a%b]}return a}function q(text,answer,explanation){return {text,answer,explanation}};
function blankProfile(name='Explorateur'){return {id:'p-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),name,grade:'6e',completed:{},attempts:[],coins:0,settings:{motion:true},createdAt:new Date().toISOString()}};
function fresh(){let p=blankProfile();return {app:'matheopolis',schemaVersion:VERSION,profiles:[p],activeId:p.id,updatedAt:new Date().toISOString()}}
let db;try{db=JSON.parse(localStorage.getItem(KEY)||'null');if(!valid(db))db=fresh()}catch{db=fresh()};let page='home',selected='6e',current=null,mode='learn',exam=null;
function valid(x){return !!(x&&x.app==='matheopolis'&&x.schemaVersion===1&&Array.isArray(x.profiles)&&x.profiles.length>0&&x.profiles.length<100&&x.profiles.every(p=>p&&typeof p.id==='string'&&typeof p.name==='string'&&p.name.length<100&&grades.some(g=>g.id===p.grade)&&p.completed&&typeof p.completed==='object'&&!Array.isArray(p.completed)&&Array.isArray(p.attempts)&&p.attempts.length<100000&&Number.isFinite(p.coins))&&x.profiles.some(p=>p.id===x.activeId))}
function profile(){return db.profiles.find(p=>p.id===db.activeId)||db.profiles[0]}
function persist(){db.updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('La sauvegarde locale a échoué. Exportez vos données et vérifiez l’espace de stockage.');return false}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function goto(p){page=p;current=null;exam=null;render();window.scrollTo(0,0)}function count(p,g){return T.filter(t=>t.grade===g&&p.completed[t.id]).length}function total(p){return Object.keys(p.completed).filter(k=>p.completed[k]).length}
function render(){const p=profile(),app=document.getElementById('app');if(page==='home'){app.innerHTML=`<section class="hero"><h1>Bienvenue à Mathéopolis !</h1><p>Bonjour <b>${esc(p.name)}</b> ! Chaque défi réussi fait grandir ton royaume. Apprends à ton rythme, explore les quatre territoires et prépare ton brevet.</p><div class="row"><span class="pill">🪙 ${p.coins} pièces</span><span class="pill">⭐ ${total(p)} compétences validées / ${T.length}</span><span class="pill">🎓 Classe : ${p.grade}</span></div></section><h2>🗺️ Les quatre territoires</h2><div class="realm-banner"><img src="assets/map.webp" alt="Carte illustrée du royaume de Mathéopolis"><div class="overlay">Explore les terres mathématiques</div></div><div class="grid">${grades.map(g=>`<article class="card realm-card"><img class="realm-art" src="assets/grade${g.id[0]}.webp" alt="Territoire ${g.id}"><h3>${g.id} — ${g.name}</h3><p>${g.desc}</p><div class="progress"><div style="width:${count(p,g.id)/T.filter(t=>t.grade===g.id).length*100}%"></div></div><p class="small">${count(p,g.id)} / ${T.filter(t=>t.grade===g.id).length} missions validées</p><button data-grade="${g.id}">Explorer ${g.id}</button></article>`).join('')}</div><section class="panel"><h2>🏗️ Ton royaume évolue</h2><div class="map">${grades.map(g=>`<div class="land">${count(p,g.id)>0?'🏰':g.emoji}<span>${g.id} · ${count(p,g.id)>0?'En construction':'À explorer'}</span></div>`).join('')}</div><p class="muted small">Les bâtiments se développent avec les missions validées.</p></section>`}
else if(page==='learn'){app.innerHTML=`<div class="realm-banner"><img src="assets/classroom.webp" alt="Académie royale des mathématiques"><div class="overlay">Académie des mathématiques</div></div><section class="panel"><h1>📚 Académie des mathématiques</h1><p>Choisis une classe et une mission. Les exercices proposent de nouvelles valeurs à chaque tentative.</p><div class="row">${grades.map(g=>`<button class="${selected===g.id?'':'secondary'}" data-grade="${g.id}">${g.emoji} ${g.id}</button>`).join('')}</div></section><div class="grid">${T.filter(t=>t.grade===selected).map(t=>`<article class="card"><span class="pill">${esc(t.domain)}</span><h3>${esc(t.title)}</h3><p>${esc(t.lesson)}</p><p>${p.completed[t.id]?'✅ Mission validée':'🔒 À découvrir'}</p><button data-topic="${t.id}">Commencer la mission</button></article>`).join('')}</div>`}
else if(page==='exercise'){const t=T.find(x=>x.id===current.id);app.innerHTML=`<div class="realm-banner"><img src="assets/lab.webp" alt="Laboratoire mathématique"><div class="overlay">Le laboratoire des défis</div></div><section class="panel"><img class="guide" src="assets/piou.webp" alt="Piou, le dragon guide"><button class="secondary" data-page="${mode==='brevet'?'brevet':'learn'}">← Retour</button><h1>🧙 ${esc(t.title)}</h1><span class="pill">${t.grade}</span><span class="pill">${esc(t.domain)}</span><div class="topic"><h3>📖 Comprendre</h3><p>${esc(t.lesson)}</p></div><div class="task"><h3>⚔️ Ton défi</h3><p style="font-size:21px;font-weight:700">${esc(current.question.text)}</p><label for="answer">Ta réponse (nombre, virgule ou fraction)</label><p><input id="answer" class="answer" inputmode="decimal" autocomplete="off" placeholder="Ex. 12,5 ou 1/2"></p><div class="actions"><button id="check">Vérifier</button><button class="secondary" id="hint">💡 Indice</button><button class="secondary" id="new">🔄 Autre exercice</button></div><div id="feedback" aria-live="polite"></div></div></section>`;document.getElementById('answer').addEventListener('keydown',e=>{if(e.key==='Enter')check()});}
else if(page==='brevet'){app.innerHTML=`<section class="hero" style="background-image:linear-gradient(90deg,#271642ed,#27164299,#27164230),url('assets/arena.webp')"><h1>🏆 L'Arène du Brevet</h1><p>Entraîne-toi avec des automatismes et des problèmes issus de notre banque d'exercices originale. Cette première version ne remplace pas encore une annale officielle complète.</p></section><div class="grid"><article class="card"><h3>⚡ Automatismes express</h3><p>10 questions à résoudre sans calculatrice. Entraînement libre, correction immédiate en fin de série.</p><button data-exam="quick">Lancer les automatismes</button></article><article class="card"><h3>🛡️ Brevet blanc découverte</h3><p>16 questions originales mélangées, barème indicatif sur 20. Format d'entraînement réduit, non officiel.</p><button data-exam="mock">Lancer le brevet découverte</button></article><article class="card"><h3>📊 Mes résultats</h3><p>${p.attempts.filter(a=>a.exam).length} réponses enregistrées en mode brevet.</p><button class="secondary" data-page="profile">Voir mon bilan</button></article></div>`}
else if(page==='exam'){const item=exam.questions[exam.index],t=T.find(x=>x.id===item.id);app.innerHTML=`<div class="realm-banner"><img src="assets/examroom.webp" alt="Salle du brevet"><div class="overlay">Épreuve royale</div></div><section class="panel"><div class="row spread"><h1>🏆 ${exam.kind==='quick'?'Automatismes':'Brevet découverte'}</h1><span class="pill">Question ${exam.index+1}/${exam.questions.length}</span></div><div class="progress"><div style="width:${exam.index/exam.questions.length*100}%"></div></div><p class="muted">${esc(t.grade)} · ${esc(t.domain)}</p><div class="task"><h2>${esc(item.question.text)}</h2><label for="examAnswer">Ta réponse</label><p><input id="examAnswer" class="answer" inputmode="decimal" placeholder="Nombre ou fraction"></p><button id="examNext">${exam.index===exam.questions.length-1?'Terminer et corriger':'Question suivante →'}</button></div><p class="small warning">Entraînement original : ne reproduit pas les conditions complètes du DNB.</p></section>`}
else if(page==='examResults'){let good=exam.results.filter(r=>r.correct).length;app.innerHTML=`<section class="panel"><h1>🏅 Bilan de ton entraînement</h1><h2>${good}/${exam.questions.length} bonnes réponses · ${Math.round(20*good/exam.questions.length*10)/10}/20 (indicatif)</h2><p>Lis les corrections pour comprendre tes erreurs.</p>${exam.results.map((r,i)=>`<div class="topic"><b>${r.correct?'✅':'🔎'} Question ${i+1} : ${esc(r.text)}</b><p>Ta réponse : ${esc(r.given||'Non renseignée')} · Attendu : ${esc(r.expected)}</p><p>${esc(r.explanation)}</p></div>`).join('')}<button data-page="brevet">Retour à l'Arène</button></section>`}
else if(page==='profile'){app.innerHTML=`<section class="panel"><img class="guide" src="assets/milo.webp" alt="Milo, guide du royaume"><h1>👤 Mes profils</h1><p>Les profils sont enregistrés uniquement dans ce navigateur.</p><div class="row">${db.profiles.map(x=>`<button class="${x.id===db.activeId?'':'secondary'}" data-profile="${esc(x.id)}">${esc(x.name)} ${x.id===db.activeId?'✓':''}</button>`).join('')}</div><div class="actions"><input id="newName" class="answer" maxlength="35" placeholder="Nom du nouveau profil"><button id="addProfile">Créer un profil</button></div><h2>Profil actif : ${esc(p.name)}</h2><label for="gradeSelect">Classe suivie</label><p><select id="gradeSelect" class="answer">${grades.map(g=>`<option ${p.grade===g.id?'selected':''}>${g.id}</option>`).join('')}</select></p><div class="row"><div class="stat"><b>${total(p)}/${T.length}</b>Compétences validées</div><div class="stat"><b>${p.coins}</b>Pièces gagnées</div><div class="stat"><b>${p.attempts.length}</b>Réponses données</div></div><h3>Maîtrise par classe</h3>${grades.map(g=>`<p>${g.id} · ${count(p,g.id)} / ${T.filter(t=>t.grade===g.id).length}</p><div class="progress"><div style="width:${100*count(p,g.id)/T.filter(t=>t.grade===g.id).length}%"></div></div>`).join('')}</section>`}
else if(page==='save'){app.innerHTML=`<section class="panel"><img class="guide" src="assets/ada.webp" alt="Ada, gardienne des sauvegardes"><h1>💾 Centre de sauvegarde</h1><p>La progression est enregistrée automatiquement dans ce navigateur après chaque activité. Pour éviter toute perte lors d'un changement d'appareil ou d'un effacement du navigateur, exporte régulièrement un fichier JSON.</p><div class="grid"><article class="card"><div class="emoji">📥</div><h3>Exporter mes données</h3><p>Une copie complète de tous les profils, missions, résultats et récompenses au format .json.</p><button id="export">Télécharger le JSON</button></article><article class="card"><div class="emoji">📤</div><h3>Importer mes données</h3><p>Vérification du fichier, puis confirmation avant de remplacer les profils présents.</p><button id="import">Choisir un fichier JSON</button></article></div><div class="topic"><b>État de la sauvegarde</b><p>${db.profiles.length} profil(s) · Dernière modification : ${esc(new Date(db.updatedAt).toLocaleString('fr-FR'))}</p><p class="small">Les données locales peuvent être supprimées par le navigateur. Conserve tes exports dans un endroit sûr.</p></div><button class="danger" id="reset">Réinitialiser toutes les données</button></section>`}
wire()}
function wire(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>goto(b.dataset.page));document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{selected=b.dataset.grade;page='learn';render();window.scrollTo(0,0)});document.querySelectorAll('[data-topic]').forEach(b=>start(b.dataset.topic));document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>{db.activeId=b.dataset.profile;persist();render()});const add=document.getElementById('addProfile');if(add)add.onclick=()=>{let name=document.getElementById('newName').value.trim();if(!name)return alert('Saisis un nom de profil.');if(db.profiles.length>=20)return alert('Maximum 20 profils.');let p=blankProfile(name);db.profiles.push(p);db.activeId=p.id;persist();render()};const grade=document.getElementById('gradeSelect');if(grade)grade.onchange=()=>{profile().grade=grade.value;persist();render()};const checkButton=document.getElementById('check');if(checkButton)checkButton.onclick=check;const hint=document.getElementById('hint');if(hint)hint.onclick=()=>document.getElementById('feedback').innerHTML=`<div class="feedback">💡 ${esc(T.find(t=>t.id===current.id).lesson)}</div>`;const newer=document.getElementById('new');if(newer)newer.onclick=()=>start(current.id);document.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>startExam(b.dataset.exam));const next=document.getElementById('examNext');if(next)next.onclick=examNext;const exp=document.getElementById('export');if(exp)exp.onclick=exportData;const imp=document.getElementById('import');if(imp)imp.onclick=()=>document.getElementById('importFile').click();const reset=document.getElementById('reset');if(reset)reset.onclick=()=>{if(confirm('Effacer tous les profils et leurs progressions ? Pense à exporter une sauvegarde.'))if(confirm('Confirmation définitive : supprimer toutes les données locales ?')){db=fresh();persist();goto('home')}}}
function start(id){const t=T.find(t=>t.id===id);if(!t)return;current={id,question:t.gen(),done:false};mode='learn';page='exercise';render()}
function parseNumber(raw){let s=String(raw).trim().replace(/\s/g,'').replace(',','.');if(!s||!/^[+-]?(?:\d+(?:\.\d+)?|\.\d+)(?:\/[+-]?(?:\d+(?:\.\d+)?|\.\d+))?$/.test(s))return NaN;if(s.includes('/')){let [a,b]=s.split('/').map(Number);return b===0?NaN:a/b}return Number(s)}
function same(a,b){return Number.isFinite(a)&&Math.abs(a-b)<1e-7}
function check(){if(current.done)return;const raw=document.getElementById('answer').value,got=parseNumber(raw),expected=current.question.answer,correct=same(got,expected),p=profile();if(!Number.isFinite(got)){document.getElementById('feedback').innerHTML='<div class="feedback bad">Saisis un nombre valide (ex. 3,5 ou 1/2).</div>';return}p.attempts.push({id:current.id,at:new Date().toISOString(),correct,answer:raw});if(p.attempts.length>5000)p.attempts=p.attempts.slice(-5000);if(correct&&!p.completed[current.id]){p.completed[current.id]=true;p.coins+=20}persist();current.done=true;document.getElementById('feedback').innerHTML=`<div class="feedback ${correct?'good':'bad'}"><b>${correct?'🎉 Bravo ! Mission réussie. +20 pièces si première validation.':'🔎 Pas encore. Voici comment faire :'}</b><p>${esc(current.question.explanation)}</p><p>Réponse attendue : <b>${expected}</b></p><button id="retry">${correct?'Nouvelle question':'Réessayer avec un nouvel exemple'}</button></div>`;document.getElementById('check').disabled=true;document.getElementById('retry').onclick=()=>start(current.id)}
function startExam(kind){let pool=[...T];for(let i=pool.length-1;i>0;i--){let j=ri(0,i);[pool[i],pool[j]]=[pool[j],pool[i]]}let n=kind==='quick'?10:16;exam={kind,questions:pool.slice(0,n).map(t=>({id:t.id,question:t.gen()})),index:0,results:[]};page='exam';render()}
function examNext(){let item=exam.questions[exam.index],raw=document.getElementById('examAnswer').value,got=parseNumber(raw),correct=same(got,item.question.answer);exam.results.push({text:item.question.text,given:raw,correct,expected:item.question.answer,explanation:item.question.explanation});let p=profile();p.attempts.push({id:item.id,at:new Date().toISOString(),correct,answer:raw,exam:exam.kind});if(p.attempts.length>5000)p.attempts=p.attempts.slice(-5000);persist();exam.index++;if(exam.index===exam.questions.length)page='examResults';render();window.scrollTo(0,0)}
function exportData(){const payload=JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2),blob=new Blob([payload],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`matheopolis_sauvegarde_${new Date().toISOString().slice(0,10)}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
document.getElementById('importFile').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>15*1024*1024)return alert('Fichier trop volumineux (maximum 15 Mo).');let incoming;try{incoming=JSON.parse(await file.text())}catch{return alert('Ce fichier n’est pas un JSON valide.')}if(!valid(incoming))return alert('Sauvegarde incompatible ou données invalides. Aucune donnée modifiée.');if(!confirm(`Importer ${incoming.profiles.length} profil(s) ? Les données locales actuelles seront remplacées. Exporte-les avant de continuer.`))return;let old=db;db=incoming;if(!persist()){db=old;persist();return}alert('Importation réussie.');goto('home')});
window.addEventListener('beforeunload',e=>{if(page==='exam'&&exam&&exam.index>0){e.preventDefault()}});
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
